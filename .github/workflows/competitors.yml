name: competitors
# Weekly: Japanese tech/AI Shorts that grew this week, and what they do (tools/competitors.py) -> branch metrics, competitors/<date>.json
on:
  schedule:
    - cron: "17 1 * * 1"   # Monday 10:17 Japan time (before the weekly review at 12:47)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q google-api-python-client google-auth
      - name: study
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/competitors.py /tmp/c.json
      - name: push to branch metrics
        run: |
          D=$(python3 -c "import json;print(json.load(open('/tmp/c.json'))['date'])")
          git init -q /tmp/r && cd /tmp/r
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          if git fetch -q origin metrics; then git checkout -q -B metrics origin/metrics; else git checkout -q --orphan metrics; fi
          mkdir -p competitors; cp /tmp/c.json "competitors/$D.json"
          git add competitors; git commit -q --allow-empty -m "competitors $D"
          for i in 1 2 3; do git push -q origin metrics && break; git pull -q --rebase origin metrics; done
