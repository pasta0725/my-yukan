name: factcheck-pages
# Fact check (step 5-2): downloads the source_url and refs of every story in data/<edition>.json,
# saves the page text as factcheck/<edition>/<story id>.txt and pushes it to the branch "factcheck".
# The Claude session then reads them with `git fetch origin factcheck` — it opens no web page itself.
on:
  workflow_dispatch:
    inputs:
      edition: {description: "edition id, e.g. 2026-11-10-am", required: true}
      check: {description: "yes = after the pages are pushed, Codex also checks and fixes the articles (codex-factcheck.yml, 2026-11-14)", required: false, default: "no"}
      src_ref: {description: "optional commit to read data/<edition>.json from (default: main now; for tests on past editions)", required: false, default: ""}
      model: {description: "Codex model for the check", required: false, default: "gpt-6-astra"}
      effort: {description: "reasoning effort for the check", required: false, default: "high"}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests beautifulsoup4
      - env: { ED: "${{ inputs.edition }}", SRC_REF: "${{ inputs.src_ref }}" }
        run: |
          if [ -n "$SRC_REF" ]; then git fetch -q --depth=1 origin "$SRC_REF" && git show "FETCH_HEAD:data/$ED.json" > /tmp/ed.json; else cp "data/$ED.json" /tmp/ed.json; fi
          python3 tools/fetch_refs.py "$ED" "/tmp/fc/$ED" /tmp/ed.json
      - name: push to branch factcheck
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin factcheck || true
          if git rev-parse -q --verify origin/factcheck; then git checkout -q -B factcheck origin/factcheck; else git checkout -q --orphan factcheck; git rm -rfq .; fi
          mkdir -p factcheck; rm -rf "factcheck/${{ inputs.edition }}"; cp -r "/tmp/fc/${{ inputs.edition }}" factcheck/
          git add factcheck; git commit -qm "factcheck pages ${{ inputs.edition }}" || true
          git push -q origin factcheck
  # 2026-11-14: 事実の点検 by Codex (factcheck/<edition>/fixed/ and changes.md). The pages above are already pushed, so if this
  # fails the Claude session still does the check the old way.
  check:
    needs: fetch
    if: inputs.check == 'yes'
    uses: ./.github/workflows/codex-factcheck.yml
    with: { edition: "${{ inputs.edition }}", src_ref: "${{ inputs.src_ref }}", model: "${{ inputs.model }}", effort: "${{ inputs.effort }}" }
    secrets: inherit
