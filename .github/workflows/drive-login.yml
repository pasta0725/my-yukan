name: drive-login
# Once (and again only if Drive access stops working): lets GitHub put finished Shorts into Google Drive (Issue #11, 2026-11-12).
# The run's summary shows a code and https://www.google.com/device - open it, sign in as pastachannel0725, allow.
# The key is saved as the secret DRIVE_REFRESH_TOKEN and is never shown. Needs the secrets DRIVE_CLIENT_ID, DRIVE_CLIENT_SECRET
# and GH_SECRETS_TOKEN (a GitHub token that may write this repository's secrets) - see tools/README.md 「ドライブへの保管」.
on:
  workflow_dispatch:
    inputs:
      mode: {description: "check = only test that the sign-in can start; login = sign in and save the key", default: "login"}
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: sign in (see the summary for the code)
        env: { DRIVE_CLIENT_ID: "${{ secrets.DRIVE_CLIENT_ID }}", DRIVE_CLIENT_SECRET: "${{ secrets.DRIVE_CLIENT_SECRET }}", YT_CLIENT_ID: "${{ secrets.YT_CLIENT_ID }}", YT_CLIENT_SECRET: "${{ secrets.YT_CLIENT_SECRET }}" }
        run: |
          if [ "${{ inputs.mode }}" = check ]; then python3 tools/drive_store.py check; exit $?; fi
          python3 tools/drive_store.py login /tmp/rt
      - name: save the key as a secret
        if: inputs.mode != 'check'
        env: { GH_TOKEN: "${{ secrets.GH_SECRETS_TOKEN }}" }
        run: |
          gh secret set DRIVE_REFRESH_TOKEN --repo "${{ github.repository }}" < /tmp/rt
          shred -u /tmp/rt
          echo "ok: DRIVE_REFRESH_TOKEN saved" | tee -a "$GITHUB_STEP_SUMMARY"
