name: site-stats
# Daily visitor numbers of 星餓りなのテックニュース from Cloudflare Web Analytics.
# Needs the repository secret CF_API_TOKEN (Cloudflare API token, "Account Analytics: Read" only).
# The result is kept as a workflow artifact "site-stats" (not committed), read by the daily dashboard task.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 21 * * *"   # 06:41 Japan time
permissions:
  contents: read
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: collect
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: CF_DEBUG=1 python3 -I tools/cf_stats.py stats.json
      - uses: actions/upload-artifact@v4
        with:
          name: site-stats
          path: stats.json
          retention-days: 7
