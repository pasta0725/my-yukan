name: official-images
# Finds official pictures for stories with few of them (see tools/find_official_images.py).
# Result: artifact "official-images" (candidates.json, report.json, sheet_NN.jpg). Nothing is committed.
on:
  workflow_dispatch:
    inputs:
      dates: {description: "dates, comma separated, or all", required: true}
      extra: {description: "optional json in the repo: {story id: [official page urls]}", required: false, default: ""}
      max_press: {description: "stories with at most this many official pictures", required: false, default: "1"}
      only_extra: {description: "only stories listed in extra (yes/no)", required: false, default: "no"}
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests beautifulsoup4 pillow
      - name: find
        run: |
          args="--dates ${{ inputs.dates }} --max-press ${{ inputs.max_press }} --out out"
          [ -n "${{ inputs.extra }}" ] && args="$args --extra ${{ inputs.extra }}"
          [ "${{ inputs.only_extra }}" = "yes" ] && args="$args --only-extra"
          python3 tools/find_official_images.py $args
      - uses: actions/upload-artifact@v4
        with: {name: official-images, path: out, retention-days: 7}
