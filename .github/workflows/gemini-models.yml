name: gemini-models
# Lists the Gemini models whose name contains "tts" (names only, the key is never printed).
on: { workflow_dispatch: {} }
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          curl -s -H "x-goog-api-key: $GEMINI_API_KEY" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" \
            | python3 -c "import json,sys;[print(m['name']) for m in json.load(sys.stdin).get('models',[]) if 'tts' in m['name']]"
