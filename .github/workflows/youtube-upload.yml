name: youtube-upload
# Uploads a finished Short to the 星餓りな channel without a PC (tools/youtube_upload.py).
# The video is read from the throwaway branch upload-tmp (tools/metadata_rules.md 「完成動画の保管」).
# Secrets (set by the user): YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN.
on:
  workflow_dispatch:
    inputs:
      name: {description: "short name, e.g. rina_health (channel/meta/<name>.json)", required: true}
      video: {description: "file name on branch upload-tmp, e.g. rina_health.mp4 (- = only check the keys)", required: true}
      comment: {description: "first comment (optional)", default: ""}
      privacy: {description: "public / private / unlisted", default: "public"}
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q google-api-python-client google-auth
      - name: get the video
        if: inputs.video != '-'
        env: { V: "${{ inputs.video }}" }
        run: |
          git fetch -q origin upload-tmp
          git show "origin/upload-tmp:$V" > /tmp/video.mp4
          ls -la /tmp/video.mp4
      - name: upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          N: ${{ inputs.name }}
          C: ${{ inputs.comment }}
          P: ${{ inputs.privacy }}
          V: ${{ inputs.video }}
        run: |
          F=/tmp/video.mp4; [ "$V" = "-" ] && F=-
          python3 tools/youtube_upload.py "$N" "$F" --comment "$C" --privacy "$P"
