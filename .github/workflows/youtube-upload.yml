name: youtube-upload
# Uploads a finished Short to the 星餓りな channel without a PC (tools/youtube_upload.py).
# The video is read from the throwaway branch upload-tmp (tools/metadata_rules.md 「完成動画の保管」).
# Secrets (set by the user): YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN.
on:
  workflow_dispatch:
    inputs:
      name: {description: "short name, e.g. rina_health (channel/meta/<name>.json)", required: true}
      video: {description: "file on branch upload-tmp (e.g. rina_health.mp4), - = check keys, or thumb:/stop:/go:/status:/comment:/playlist:<videoId>, banner:<repo path>", required: true}
      comment: {description: "first comment (optional)", default: ""}
      privacy: {description: "public / private / unlisted", default: "public"}
      publish_at: {description: "scheduled publish time, e.g. 2026-11-10T21:00:00+09:00 (uploads as private until then)", default: ""}
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs: { video_id: "${{ steps.up.outputs.video_id }}" }
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/work_branch.py get channel/thumbs || true   # thumbnails live on the branch work since 2026-11-12
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q google-api-python-client google-auth
      - name: get the video
        if: inputs.video != '-' && !contains(inputs.video, ':')
        env: { V: "${{ inputs.video }}" }
        run: |
          git fetch -q origin upload-tmp
          git show "origin/upload-tmp:$V" > /tmp/video.mp4
          ls -la /tmp/video.mp4
      - name: upload
        id: up
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          N: ${{ inputs.name }}
          C: ${{ inputs.comment }}
          P: ${{ inputs.privacy }}
          V: ${{ inputs.video }}
          T: ${{ inputs.publish_at }}
        run: |
          F=/tmp/video.mp4; [ "$V" = "-" ] && F=-; case "$V" in *:*) F="$V";; esac
          python3 tools/youtube_upload.py "$N" "$F" --comment "$C" --privacy "$P" --publish-at "$T"
  comment:
    # a scheduled video is private until publish_at, so the thumbnail is set again and the first comment is posted after it
    # goes public. 2026-11-18: that is done by after-public.yml (it relays itself past GitHub's 6-hour job limit; the old
    # waiting job here was cancelled for the 7:00 publishes uploaded the evening before).
    needs: upload
    if: inputs.publish_at != '' && needs.upload.outputs.video_id != ''
    permissions: { contents: read, actions: write }
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: start after-public.yml
        env: { GH_TOKEN: "${{ github.token }}", N: "${{ inputs.name }}", C: "${{ inputs.comment }}", T: "${{ inputs.publish_at }}", ID: "${{ needs.upload.outputs.video_id }}" }
        run: gh workflow run after-public.yml --repo "${{ github.repository }}" --ref main -f name="$N" -f id="$ID" -f at="$T" -f comment="$C"
  after_public:
    # a video published at once (no publish_at): the Shorts grid kept the frame instead of the thumbnail (2026-11-13),
    # so the thumbnail is set once more a few minutes later, then the video and materials go to Drive (drive-store.yml).
    # (2026-11-13: setting it by hand failed because drive-store had already deleted the branch work with the thumbnail.)
    needs: upload
    if: inputs.publish_at == '' && inputs.privacy == 'public' && needs.upload.outputs.video_id != '' && !contains(inputs.video, ':')
    permissions: { contents: read, actions: write }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/work_branch.py get channel/thumbs || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q google-api-python-client google-auth
      - name: set the thumbnail again after 3 minutes
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          N: ${{ inputs.name }}
          ID: ${{ needs.upload.outputs.video_id }}
        run: sleep 180; python3 tools/youtube_upload.py "$N" "thumb:$ID" || echo "thumbnail again failed (set it with video=thumb:$ID)"
      - name: move the video and its materials to Google Drive
        env: { GH_TOKEN: "${{ github.token }}", N: "${{ inputs.name }}" }
        run: gh workflow run drive-store.yml --repo "${{ github.repository }}" -f name="$N" || echo "start drive-store.yml by hand (name=$N)"
