name: codex-auth-refresh
# 2026-11-28 (the user's request, Issue #27): keep the Codex login (secret CODEX_AUTH) from expiring.
# Why it expired: the login has a "refresh token" that can be used only once. When any Codex job renewed the login,
# the new token stayed inside that job and the secret kept the old, now-used one, so every later job got
# "401 ... refresh token was already used" until the user logged in again (11/16, 11/27).
# What this does, once a day before the morning edition and right after the user updates CODEX_AUTH:
#   1 sets up Codex from CODEX_AUTH and renews the login now (the same OAuth refresh Codex itself does)
#   2 writes the new auth.json back to the secret CODEX_AUTH (needs the secret CODEX_AUTH_WRITER:
#     a fine-grained token for this repository with "Secrets: Read and write"; GITHUB_TOKEN cannot change secrets)
#   3 checks the new login with one tiny Codex request
#   4 on failure, opens (or comments on) an Issue so the next edition knows before it starts
# Because the login is always less than a day old, the other Codex jobs never renew it themselves, so they cannot
# use up the token at the same time. The secret value is never printed.
on:
  schedule:
    - cron: "37 18 * * *"   # 03:37 Japan time, before the morning edition (about 04:10) and no other Codex job runs then
  workflow_dispatch:
concurrency: { group: codex-auth-refresh, cancel-in-progress: false }
permissions:
  contents: read
  issues: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/codex-setup
        with: { auth: "${{ secrets.CODEX_AUTH }}" }
      - name: check the writer token
        env: { W: "${{ secrets.CODEX_AUTH_WRITER }}" }
        run: |
          test -n "$W" || { echo "RESULT: FAILED no secret CODEX_AUTH_WRITER (the user has to add it, see tools/README.md「Codexのログイン」)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: renew the login
        # 2026-11-28 first run: Codex renews only when the access token is (nearly) expired, not by last_refresh, so marking the
        # login as old did nothing. Now we renew it ourselves the same way Codex does (OAuth refresh at auth.openai.com, Codex's
        # client id) and keep the new tokens in auth.json. Nothing secret is printed.
        run: |
          python3 - "$CODEX_HOME/auth.json" <<'EOF'
          import json, sys, urllib.request, urllib.error, datetime as D
          p = sys.argv[1]; d = json.load(open(p, encoding="utf-8-sig"))
          t = d.get("tokens") or {}
          if not t.get("refresh_token"): sys.exit("RESULT: FAILED CODEX_AUTH has no refresh_token (it must be the whole auth.json of a ChatGPT login)")
          body = json.dumps({"client_id": "app_EMoamEEZ73f0CkXaXp7hrann", "grant_type": "refresh_token",
                             "refresh_token": t["refresh_token"], "scope": "openid profile email"}).encode()
          req = urllib.request.Request("https://auth.openai.com/oauth/token", body, {"Content-Type": "application/json"})
          try: r = json.load(urllib.request.urlopen(req, timeout=60))
          except urllib.error.HTTPError as e:
              try: err = json.loads(e.read()).get("error")
              except Exception: err = ""
              err = err.get("code") or err.get("message") if isinstance(err, dict) else err
              sys.exit(f"RESULT: FAILED renewing the login: HTTP {e.code} {str(err)[:120]} (if the token was already used or expired, the user has to log in again)")
          if not r.get("access_token"): sys.exit("RESULT: FAILED the renewal answer had no access_token")
          for k in ("id_token", "access_token", "refresh_token"):
              if r.get(k): t[k] = r[k]
          d["tokens"] = t
          d["last_refresh"] = D.datetime.now(D.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")
          json.dump(d, open(p, "w"), indent=2)
          print("renewed" + (" (new refresh token)" if r.get("refresh_token") else ""))
          EOF
      - name: write the new login back to CODEX_AUTH
        env: { GH_TOKEN: "${{ secrets.CODEX_AUTH_WRITER }}" }
        run: |
          gh secret set CODEX_AUTH --repo "$GITHUB_REPOSITORY" < "$CODEX_HOME/auth.json"
          mkdir -p /tmp/ping && cd /tmp/ping
          timeout 180 codex exec --skip-git-repo-check -s read-only "Reply with the single word OK." > out.txt 2>&1 || true
          if grep -qiE "401 Unauthorized|refresh token|sign in again" out.txt; then
            echo "RESULT: FAILED the login was saved but Codex refused it" | tee -a "$GITHUB_STEP_SUMMARY"
            tail -5 out.txt | sed -E 's/eyJ[A-Za-z0-9._-]*/<token>/g'; exit 1
          fi
          echo "RESULT: OK the Codex login was renewed and saved to CODEX_AUTH ($(date -u +%FT%TZ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: report a failure in an Issue
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T="[自動] Codexのログインを更新できませんでした"
          B="codex-auth-refresh（$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID）が失敗しました。要約（Summary）の RESULT の行に理由があります。ログイン切れなら、tools/README.md「Codexのログイン」の手順で、ユーザーが Codex にログインし直して CODEX_AUTH を更新してください。直るまで Codex の作業（記事・点検・サムネ・画面の確認）は Sonnet の予備で行います。"
          N=$(gh api -X GET "repos/$GITHUB_REPOSITORY/issues" -f state=open -f labels=AIからの報告 -f per_page=50 --jq ".[] | select(.title==\"$T\") | .number" | head -1)
          if [ -n "$N" ]; then gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" -f body="$(date -u +%F) も失敗。$B"
          else gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$T" -f body="$B" -f 'labels[]=AIからの報告'; fi
