name: fetch-media
# Downloads public media files (official press images/videos) listed in media/<name>/urls.txt into the same folder
# on the branch "work" (get them with: python3 tools/work_branch.py get media/<name>).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["media/*/urls.txt"]
permissions:
  contents: write
concurrency: fetch-media
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          git config user.name pasta0725; git config user.email pasta0725@users.noreply.github.com
          python3 tools/work_branch.py get media || true   # files fetched before (on the branch work) are not fetched again
          for f in media/*/urls.txt; do
            d=$(dirname "$f")
            while read -r name url; do
              [ -z "$name" ] && continue
              [ -e "$d/$name" ] && continue
              curl -sSL --fail --max-time 120 -A "Mozilla/5.0" -o "$d/$name" "$url" || echo "failed: $url"
            done < "$f"
          done
          ls -la media/*
          # pictures and videos go to the throwaway branch "work", not main (user 2026-11-12)
          python3 tools/work_branch.py put media
