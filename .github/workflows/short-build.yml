name: short-build
# Makes and checks a Short with no Claude (2026-11-14, user: replace the Sonnet executor B of tools/auto_short.md 2-2).
# Needs on main: shorts/<name>/spec.json, short.html (+ longcat/jobs.json if she talks big at the end), channel/meta/<name>.json;
# on the branch work: the narration (short-voice.yml), pictures/videos the page uses, channel/thumbs/<name>.jpg.
#   prep    : audio of every line (tools/short_auto.py assemble) -> short_plan.py -> plan.js, audio, subtitles
#             (channel/captions/<name>_ja.srt and shorts/<name>/plan.js are pushed to main), silence/length check,
#             longcat/<scene>.wav from the finished line
#   longcat : longcat-colab.yml (Colab, then Modal) only when that clip is missing or its audio changed
#   facts   : codex-short-factcheck.yml (Codex gpt-6.1-sol, high) on script, subtitles, title and description
#   render  : big presenter frames (tools/big_clip.py), check_fit.js, render_par.js -> work: final/<name>.mp4 (+ final/<name>_sheets/)
#   voice   : tools/check_voice.py on the video        frames: Codex screen check (shorts/_template/codex_frame_check.py)
#   report  : branch checks, checks/<name>/build.md (+ the parts) and the job summary. First line RESULT: OK | LOOK, then every
#             LOOK line of every part ("- LOOK [part] …"). The run is green only for OK. Upload: short-upload.yml.
on:
  workflow_dispatch:
    inputs:
      name: {description: "short name, e.g. rina_ff7", required: true}
      refs: {description: "fact check references, space separated <edition>/<article id> (empty = shorts/<name>/refs.txt)", default: ""}
      spec: {description: "spec.json (empty = shorts/<name>/spec.json; work:<path> also works)", default: ""}
      longcat: {description: "auto = make the talking clip when missing / skip", default: "auto"}
      longcat_wait: {description: "minutes to retry Colab before Modal", default: "20"}
      longcat_fallback: {description: "Modal when Colab gives no clip (yes/no)", default: "yes"}
      facts: {description: "run the fact check (yes/no)", default: "yes"}
      fact_model: {description: "Codex model for the fact check", default: "gpt-6.1-sol"}
      frame_model: {description: "Codex model for the screen check", default: "gpt-6-astra"}
      effort: {description: "Codex reasoning effort", default: "high"}
permissions:
  contents: write
concurrency: {group: "short-build-${{ inputs.name }}", cancel-in-progress: false}
env:
  NM: "${{ inputs.name }}"
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      plan: "${{ steps.plan.outputs.plan }}"
      longcat: "${{ steps.lc.outputs.longcat }}"
      script: "${{ steps.plan.outputs.script }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # lipsync_ja.py runs with python3 -I (no user site): packages must be in the main site
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/pip, key: "pip-short-pyopenjtalk-0.4.1-py312" }
      - name: tools
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q numpy scipy pillow pyopenjtalk==0.4.1
      - name: materials from the branch work (text files on main win)
        run: |
          python3 tools/work_branch.py get "shorts/$NM" narration media channel/thumbs || true
          git checkout -- .   # files tracked on main (spec.json, short.html ...) stay as on main
          mkdir -p "shorts/$NM/img" /tmp/b /tmp/rep; [ -f "shorts/$NM/img/logo.png" ] || cp channel/logo.png "shorts/$NM/img/logo.png"
      - name: audio and timing
        id: plan
        env: { SP: "${{ inputs.spec }}" }
        run: |
          S="${SP:-shorts/$NM/spec.json}"
          case "$S" in work:*) git show "origin/work:${S#work:}" > /tmp/b/spec_in.json;; *) cp "$S" /tmp/b/spec_in.json;; esac
          echo "script=$S" >> "$GITHUB_OUTPUT"
          python3 tools/sfx.py /tmp/b/sfx 90 >/dev/null
          python3 tools/short_auto.py assemble /tmp/b/spec_in.json "$NM" /tmp/b; cp /tmp/b/assemble.md /tmp/rep/
          set +e; python3 tools/short_plan.py /tmp/b/spec.json "shorts/$NM/work" > /tmp/b/plan.log 2>&1; code=$?; set -e
          tail -3 /tmp/b/plan.log
          last=$(grep -E '^\{' /tmp/b/plan.log | tail -1)
          case $code in
            0) echo "RESULT: OK" > /tmp/rep/plan.md; echo "plan=ok" >> "$GITHUB_OUTPUT";;
            3) printf 'RESULT: LOOK\n- LOOK 登場の秒数｜音声の秒数（spec の sec）と合わない｜この1文を作り直す：%s｜short_plan.py\n' "$last" > /tmp/rep/plan.md;;
            4) printf 'RESULT: LOOK\n- LOOK 長さ｜登場のあとが60秒を超える｜台本を削る：%s｜short_plan.py\n' "$last" > /tmp/rep/plan.md;;
            *) printf 'RESULT: LOOK\n- LOOK 台本の秒数｜short_plan.py が止まった（終了コード %s）｜%s｜Actions の画面\n' "$code" "$(tail -1 /tmp/b/plan.log | cut -c1-200)" > /tmp/rep/plan.md;;
          esac
          [ $code = 0 ] || exit 0
          cp "shorts/$NM/work/plan.js" "shorts/$NM/plan.js"
          python3 tools/short_auto.py silence /tmp/b/spec.json "shorts/$NM/work" /tmp/rep/silence.md
          python3 tools/short_auto.py srt "shorts/$NM/plan.js" "channel/captions/${NM}_ja.srt"
          cp /tmp/b/spec.json "shorts/$NM/work/spec_ci.json"
      - name: subtitles and plan.js to main (not when a test spec is given)
        if: steps.plan.outputs.plan == 'ok'
        env: { SP: "${{ inputs.spec }}" }
        run: |
          git config user.name pasta0725; git config user.email pasta0725@users.noreply.github.com
          mkdir -p final; cp "channel/captions/${NM}_ja.srt" "final/${NM}_ja.srt"
          python3 tools/work_branch.py put "final/${NM}_ja.srt"
          git add "channel/captions/${NM}_ja.srt" "shorts/$NM/plan.js"
          if [ -n "$SP" ]; then echo "test spec ($SP): main is not changed"; git diff --cached --stat; git reset -q
          elif ! git diff --cached --quiet; then
            git commit -qm "ショート自動：$NM の plan.js と字幕"
            for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
          fi
      - name: talking clip needed?
        id: lc
        if: steps.plan.outputs.plan == 'ok' && inputs.longcat != 'skip'
        run: |
          J="shorts/$NM/longcat/jobs.json"; [ -f "$J" ] || { echo "longcat=no" >> "$GITHUB_OUTPUT"; exit 0; }
          git fetch -q origin "+generated:refs/remotes/origin/generated" 2>/dev/null || true
          python3 - "$NM" > /tmp/b/lc.txt <<'PY'
          import hashlib, json, math, os, shutil, subprocess, sys, wave
          nm = sys.argv[1]; D = f"shorts/{nm}/longcat"; J = json.load(open(f"{D}/jobs.json"))
          spec = json.load(open("/tmp/b/spec.json")); need = False; looks = []; changed = False
          md5 = lambda p: hashlib.md5(open(p, "rb").read()).hexdigest() if os.path.exists(p) else ""
          for job in J:
              sc = job[0]; idx = [i for i, l in enumerate(spec["lines"], 1) if l.get("scene") == sc]
              if not idx: looks.append(f"- LOOK 締めの話す動画｜jobs.json の {sc} が台本にない｜-｜{D}/jobs.json"); continue
              src = f"shorts/{nm}/work/l{idx[0]}.wav"; dst = f"{D}/{sc}.wav"
              have = subprocess.run(["git", "cat-file", "-e", f"origin/generated:generated/{nm}_longcat/{sc}.mp4"], capture_output=True).returncode == 0
              if not (have and md5(src) == md5(dst)): need = True
              shutil.copy(src, dst)
              with wave.open(src) as w: seg = max(1, math.ceil(w.getnframes() / w.getframerate() / 2.5 - 1e-6))
              if job[1] != seg: job[1] = seg; changed = True   # about 2.5 s of audio per segment (tools/shorts_rules.md)
              img = job[3]
              if not os.path.exists(f"{D}/{img}"):
                  for c in (f"channel/rina_idle/longcat/{img}", f"channel/rina_poses/{img}", f"channel/rina_puppet/{img}"):
                      if os.path.exists(c): shutil.copy(c, f"{D}/{img}"); break
                  else: looks.append(f"- LOOK 締めの話す動画｜絵 {img} がない｜{D}/ に置く｜-")
          if changed: json.dump(J, open(f"{D}/jobs.json", "w"), ensure_ascii=False)
          print("need" if need and not looks else "no"); print("\n".join(looks))
          PY
          cat /tmp/b/lc.txt
          if [ "$(head -1 /tmp/b/lc.txt)" = need ]; then
            git config user.name pasta0725; git config user.email pasta0725@users.noreply.github.com
            python3 tools/work_branch.py put "shorts/$NM/longcat"
            git add "shorts/$NM/longcat/jobs.json"
            if [ -n "${{ inputs.spec }}" ]; then git reset -q
            elif ! git diff --cached --quiet; then git commit -qm "ショート自動：$NM の longcat の区切り数を音声の長さに合わせた"; for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done; fi
            echo "longcat=yes" >> "$GITHUB_OUTPUT"
          else echo "longcat=no" >> "$GITHUB_OUTPUT"; fi
          tail -n +2 /tmp/b/lc.txt | grep -q LOOK && { echo "RESULT: LOOK"; tail -n +2 /tmp/b/lc.txt; } > /tmp/rep/longcat.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rep-prep, path: /tmp/rep, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.plan == 'ok'
        with: { name: short-src, path: "shorts/${{ inputs.name }}", include-hidden-files: true }

  longcat:
    needs: prep
    if: needs.prep.outputs.longcat == 'yes'
    uses: ./.github/workflows/longcat-colab.yml
    with:
      dir: "shorts/${{ inputs.name }}/longcat"
      wait: "${{ inputs.longcat_wait }}"
      fallback: "${{ inputs.longcat_fallback }}"
    secrets: inherit

  facts:
    needs: prep
    if: always() && needs.prep.result == 'success' && inputs.facts == 'yes'
    uses: ./.github/workflows/codex-short-factcheck.yml
    with:
      name: "${{ inputs.name }}"
      refs: "${{ inputs.refs }}"
      script: "${{ needs.prep.outputs.script }}"
      srt: "${{ needs.prep.outputs.plan == 'ok' && format('work:final/{0}_ja.srt', inputs.name) || '' }}"
      model: "${{ inputs.fact_model }}"
      effort: "${{ inputs.effort }}"
    secrets: inherit

  render:
    needs: [prep, longcat]
    if: always() && needs.prep.outputs.plan == 'ok'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: short-src, path: "shorts/${{ inputs.name }}" }
      - name: tools
        run: |
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra >/dev/null
          pip install -q numpy scipy pillow
          npm i --no-save --silent playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p /tmp/rep
      - name: big presenter frames
        env: { LCR: "${{ needs.longcat.result }}" }
        run: |
          git fetch -q origin "+generated:refs/remotes/origin/generated" 2>/dev/null || true
          S="shorts/$NM/work/spec_ci.json"; : > /tmp/rep/big.txt
          for row in $(python3 -c "import json;[print(f\"{i}:{l['scene']}:{l.get('fixed_wav','')}\") for i,l in enumerate(json.load(open('$S'))['lines'],1) if l.get('scene') in ('intro','verdict')]"); do
            sc=$(echo "$row" | cut -d: -f2); fw=$(echo "$row" | cut -d: -f3); clip=""
            if [ -n "$fw" ] && [ -f "${fw%.wav}.mp4" ]; then clip="${fw%.wav}.mp4"
            elif git show "origin/generated:generated/${NM}_longcat/$sc.mp4" > "/tmp/$sc.mp4" 2>/dev/null && [ -s "/tmp/$sc.mp4" ]; then clip="/tmp/$sc.mp4"; fi
            if [ -n "$clip" ]; then python3 tools/big_clip.py "shorts/$NM/big/$sc" "$clip"; echo "$sc: $clip" >> /tmp/rep/big.txt
            else echo "- LOOK $sc｜大きいりなの話す動画がない（longcat: ${LCR:-なし}）｜longcat-colab.yml の結果を見る｜generated/${NM}_longcat/$sc.mp4" >> /tmp/rep/big.txt; fi
          done
          { grep -q LOOK /tmp/rep/big.txt && echo "RESULT: LOOK" || echo "RESULT: OK"; cat /tmp/rep/big.txt; } > /tmp/rep/big.md; cat /tmp/rep/big.md
      - name: text outside its box (check_fit.js)
        run: |
          cd "shorts/$NM"; set +e; node ../_template/check_fit.js > /tmp/fit.log 2>&1; code=$?; set -e; cat /tmp/fit.log
          { [ $code = 0 ] && echo "RESULT: OK" || echo "RESULT: LOOK"
            sed -nE 's/^OVERFLOW (.*) t=([0-9.]+)s  "(.*)"  ([0-9.]+)px outside its box$/- LOOK \2秒｜はみ出し｜場面 \1｜「\3」が枠から \4px 出ている/p' /tmp/fit.log
            grep -q '^PALETTE' /tmp/fit.log && echo "- LOOK 全体｜配色｜pal.js｜ひな形（shorts/_template/pal.js）と違う。ひな形をそのままコピーする"
            [ $code != 0 ] && [ $code != 5 ] && [ $code != 6 ] && echo "- LOOK 全体｜check_fit.js が止まった（$code）｜Actions の画面｜-"; } > /tmp/rep/fit.md || true
      - name: render
        run: |
          cd "shorts/$NM"; set +e; N=$(nproc) OUT=short.mp4 node ../_template/render_par.js > /tmp/render.log 2>&1; code=$?; set -e
          tail -5 /tmp/render.log; grep -m5 "PAGE ERROR" /tmp/render.log || true
          if [ $code = 0 ] && [ -s short.mp4 ]; then
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 short.mp4)
            { echo "RESULT: OK"; echo; echo "書き出し：${d}秒"; grep -m3 "PAGE ERROR" /tmp/render.log | sed 's/^/- LOOK 書き出し｜ページのエラー｜/;s/$/｜short.html/'; } > /tmp/rep/render.md
            if grep -q "PAGE ERROR" /tmp/render.log; then sed -i '1s/OK/LOOK/' /tmp/rep/render.md; fi
          else printf 'RESULT: LOOK\n- LOOK 書き出し｜render_par.js が失敗（%s）｜Actions の画面｜-\n' "$code" > /tmp/rep/render.md; exit 1; fi
      - name: contact sheet and the video to the branch work
        run: |
          git config user.name pasta0725; git config user.email pasta0725@users.noreply.github.com
          git fetch -q origin "+work:refs/remotes/origin/work" || true
          T=""; git show "origin/work:channel/thumbs/$NM.jpg" > /tmp/thumb.jpg 2>/dev/null && [ -s /tmp/thumb.jpg ] && T=/tmp/thumb.jpg
          python3 shorts/_template/codex_frame_check.py prep "shorts/$NM/short.mp4" /tmp/fc --script "shorts/$NM/work/spec_ci.json" --plan "shorts/$NM/plan.js" ${T:+--thumb "$T"} > /dev/null
          mkdir -p "final/${NM}_sheets"; cp "shorts/$NM/short.mp4" "final/$NM.mp4"; cp /tmp/fc/sheets/*.png "final/${NM}_sheets/"
          python3 tools/work_branch.py put "final/$NM.mp4" "final/${NM}_sheets"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rep-render, path: /tmp/rep, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with: { name: video, path: "shorts/${{ inputs.name }}/short.mp4" }

  voice:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: short-src, path: "shorts/${{ inputs.name }}" }
      - uses: actions/download-artifact@v4
        with: { name: video, path: /tmp/v }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q faster-whisper pykakasi
      - name: check
        run: |
          mkdir -p /tmp/rep; set +e
          python3 tools/check_voice.py /tmp/v/short.mp4 "shorts/$NM/work/spec_ci.json" --out /tmp/voice_report.json
          set -e; python3 tools/short_auto.py voicecheck /tmp/voice_report.json /tmp/rep/voice.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rep-voice, path: /tmp/rep, if-no-files-found: ignore }

  frames:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: short-src, path: "shorts/${{ inputs.name }}" }
      - uses: actions/download-artifact@v4
        with: { name: video, path: /tmp/v }
      - uses: ./.github/actions/codex-setup
        with: { auth: "${{ secrets.CODEX_AUTH }}" }
      - name: pictures
        run: |
          which ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -c "import PIL" 2>/dev/null || pip install -q pillow
          git fetch -q origin "+work:refs/remotes/origin/work" || true
          T=""; git show "origin/work:channel/thumbs/$NM.jpg" > /tmp/thumb.jpg 2>/dev/null && [ -s /tmp/thumb.jpg ] && T=/tmp/thumb.jpg
          python3 shorts/_template/codex_frame_check.py prep /tmp/v/short.mp4 /tmp/fc --script "shorts/$NM/work/spec_ci.json" --plan "shorts/$NM/plan.js" ${T:+--thumb "$T"}
      - name: Codex looks at the pictures (same as codex-frame-check.yml)
        env: { M: "${{ inputs.frame_model }}", E: "${{ inputs.effort }}" }
        run: |
          cd /tmp/fc
          run() {
            rm -f last.json log.txt
            timeout 1500 codex exec --skip-git-repo-check -s read-only ${1:+-m "$1"} -c model_reasoning_effort="\"$E\"" \
              --output-schema schema.json -o last.json "$(cat prompt.txt)" -i sheets/*.png > log.txt 2>&1
            echo "codex exit $?"; tail -3 log.txt
            python3 -c "import json;assert json.load(open('last.json'))['result'] in ('OK','LOOK')" 2>/dev/null; }
          run "$M" || run "" || true
          used=$(grep -m1 -E '^model:' log.txt | sed 's/model: *//'); echo "MODEL=${used:-?} (effort $E, asked $M)" >> "$GITHUB_ENV"
      - name: report
        if: always()
        run: |
          mkdir -p /tmp/rep; python3 shorts/_template/codex_frame_check.py report /tmp/fc "$NM" /tmp/rep/frames.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rep-frames, path: /tmp/rep, if-no-files-found: ignore }

  report:
    needs: [prep, longcat, facts, render, voice, frames]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "rep-*", path: /tmp/rep, merge-multiple: true }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        if: inputs.facts == 'yes'
        with: { name: "facts-${{ inputs.name }}", path: /tmp/facts }
        continue-on-error: true
      - name: one report
        run: |
          mkdir -p /tmp/rep; [ -f /tmp/facts/facts.md ] && cp /tmp/facts/facts.md /tmp/rep/facts.md
          [ "${{ inputs.facts }}" = yes ] || echo "RESULT: OK（事実確認は省略：facts=no）" > /tmp/rep/facts.md
          set +e
          python3 tools/short_auto.py collect "$NM" /tmp/build.md /tmp/rep/assemble.md /tmp/rep/plan.md /tmp/rep/silence.md /tmp/rep/longcat.md \
            /tmp/rep/big.md /tmp/rep/fit.md /tmp/rep/render.md /tmp/rep/voice.md /tmp/rep/frames.md /tmp/rep/facts.md
          echo "CODE=$?" >> "$GITHUB_ENV"; set -e
          { cat /tmp/build.md; echo; for f in /tmp/rep/*.md; do echo "<details><summary>$(basename $f)</summary>"; echo; cat "$f"; echo; echo "</details>"; done; } >> "$GITHUB_STEP_SUMMARY"
          git init -q /tmp/r && cd /tmp/r
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            if git fetch -q origin checks; then git checkout -q -f -B checks origin/checks; else git checkout -q --orphan checks; fi
            mkdir -p "checks/$NM"; cp /tmp/build.md "checks/$NM/build.md"; cp /tmp/rep/*.md "checks/$NM/" 2>/dev/null || true
            git add checks; git commit -qm "short build $NM" || true
            git push -q origin HEAD:checks && break; sleep $((i*3))
          done
      - name: result
        run: '[ "$CODE" = 0 ] || { echo "not OK (see checks/$NM/build.md)"; exit 1; }'
