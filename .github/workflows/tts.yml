name: narration
# Makes narration audio with Gemini TTS when a script file is pushed.
# The API key lives in the repository secret GEMINI_API_KEY (never in the code).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["narration/**/lines.json"]
permissions:
  contents: write
concurrency: narration
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make audio for every script that has no audio yet
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          made=0
          for f in $(find narration -name lines.json | sort); do
            d=$(dirname "$f")
            if [ ! -e "$d/s1.wav" ]; then
              # one failing script must not stop the others
              python3 -I tools/tts_gemini.py "$f" "$d" > "$d/tts_log.txt" 2>&1 || true
              cat "$d/tts_log.txt"
              made=1
            fi
          done
          if [ "$made" = 1 ]; then
            git config user.name pasta0725
            git config user.email pasta0725@users.noreply.github.com
            git add narration
            git commit -m "読み上げ音声を作成（Gemini TTS）"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; echo "push failed ($i), retrying"; sleep $((i*10)); done   # other pushes often land at the same time (Issue #4)
          fi
