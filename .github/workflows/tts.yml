name: narration
# Makes narration audio with Gemini TTS when a script file is pushed. The audio is saved on the branch "work"
# (get it with: python3 tools/work_branch.py get narration/<name>).
# The API key lives in the repository secret GEMINI_API_KEY (never in the code).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["narration/**/lines.json"]
permissions:
  contents: write
concurrency: narration
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make audio for every script that has no audio yet
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          git config user.name pasta0725; git config user.email pasta0725@users.noreply.github.com
          git fetch -q origin "+work:refs/remotes/origin/work" || true
          for f in $(find narration -name lines.json | sort); do
            d=$(dirname "$f")
            # audio already made (on main from before 2026-11-12, or on the branch work)?
            if [ -e "$d/s1.wav" ] || git cat-file -e "origin/work:$d/s1.wav" 2>/dev/null; then continue; fi
            # one failing script must not stop the others
            python3 -I tools/tts_gemini.py "$f" "$d" > "$d/tts_log.txt" 2>&1 || true
            cat "$d/tts_log.txt"
            # sounds go to the throwaway branch "work", not main (user 2026-11-12: main's history keeps them forever)
            python3 tools/work_branch.py put "$d"
          done
