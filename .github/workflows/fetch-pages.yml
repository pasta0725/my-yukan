name: fetch-pages
# Downloads the URLs given in the input (space separated) and uploads them as an artifact (nothing is committed).
on:
  workflow_dispatch:
    inputs:
      urls: {description: "space separated URLs", required: true}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; i=0
          for u in ${{ inputs.urls }}; do i=$((i+1)); curl -sSL --max-time 60 -A "Mozilla/5.0" -o "out/$i.txt" "$u" || echo "failed $u"; echo "$i $u" >> out/index.txt; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: {name: pages, path: out, retention-days: 3}
