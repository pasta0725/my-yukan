name: voice-check
# Listens to a finished Short and compares what is said with the script (tools/check_voice.py).
# media: a path in the repo, or upload-tmp:<file> for a video on the branch upload-tmp. spec: the short's spec.json.
on:
  workflow_dispatch:
    inputs:
      media: {description: "video/audio path in the repo, or upload-tmp:<file>", required: true}
      spec: {description: "spec.json path, e.g. shorts/rina_fable/spec.json", required: true}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q faster-whisper pykakasi
      - name: check
        env: { M: "${{ inputs.media }}", S: "${{ inputs.spec }}" }
        run: |
          F="$M"; case "$M" in upload-tmp:*) git fetch -q origin upload-tmp; git show "origin/upload-tmp:${M#upload-tmp:}" > /tmp/v.mp4; F=/tmp/v.mp4;; esac
          set +e; python3 tools/check_voice.py "$F" "$S" --out voice_report.json; code=$?; set -e
          echo "exit $code"; cat voice_report.json | head -c 4000
          { echo '```'; python3 -c "import json;r=json.load(open('voice_report.json'));print('similarity',r['similarity'],'adjusted',r.get('similarity_adjusted'));[print(x['line'],x['kind'],x['expected'],'->',x['heard']) for x in r['issues']+r.get('notation',[])]"; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with: { name: voice-report, path: voice_report.json }
