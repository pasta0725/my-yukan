<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マイ夕刊</title>
<meta name="description" content="AI・テック、家電・新商品、副業・ネット販売のニュースが毎日夕方に届く自分専用のニュースアプリ">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マイ夕刊">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141d" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow reading column; sticky masthead with section chips; lead story large, the rest as thumbnail rows; article opens in place. */
:root{
  --paper:#f3f4f7; --card:#ffffff; --ink:#1b2033; --sub:#5b6175; --line:#dfe2ea;
  --lamp:#e39a2f; --lamp-ink:#8a5410;
  --ai:#4b4fd6; --ai2:#2b2e8f;
  --kaden:#0f8f87; --kaden2:#0a5a63;
  --fuku:#d9822b; --fuku2:#9a4d12;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#12141d; --card:#1b1e2a; --ink:#e8eaf2; --sub:#a1a6b8; --line:#2b2f3e;
  --lamp:#f0b04f; --lamp-ink:#f6c77c;
  --ai:#6d71f0; --ai2:#33369e; --kaden:#18a69d; --kaden2:#0b5f66; --fuku:#e8913a; --fuku2:#9f5216;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:6px}

header.mast{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.mast .wrap{padding-block:12px 10px;display:grid;gap:10px}
.mast-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;letter-spacing:.02em;margin:0;display:flex;align-items:center;gap:8px}
.logo .lamp{width:14px;height:14px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 4px color-mix(in srgb,var(--lamp) 25%,transparent)}
.mast-right{display:flex;align-items:center;gap:6px}
.edition{font-size:12.5px;color:var(--sub);text-align:right;line-height:1.35}
.edition b{display:block;color:var(--ink);font-weight:700;font-size:13.5px}
.reload{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.reload svg{width:18px;height:18px}
.reload.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.6;margin-left:4px;font-size:12px}

main .wrap{padding-block:16px 40px}
.state{text-align:center;padding:56px 12px;color:var(--sub)}
.state h2{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink);margin:12px 0 6px}
.state p{margin:0;font-size:14.5px}
.state svg{width:56px;height:56px;color:var(--lamp)}

.cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em}
.cat::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.cat.ai{color:var(--ai)} .cat.kaden{color:var(--kaden)} .cat.fukugyo{color:var(--fuku)}
.meta{font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}

/* pictures: photo with credit, or generated illustration */
.th{position:relative;overflow:hidden;background:var(--line)}
.th svg{display:block;width:100%;height:100%}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.th .credit{position:absolute;right:0;bottom:0;max-width:100%;font-size:10.5px;line-height:1.3;padding:3px 7px;color:#fff;background:rgba(10,12,20,.62);border-top-left-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.lead{display:block;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:18px;cursor:pointer;width:100%;text-align:left;padding:0}
.lead .th{aspect-ratio:16/9;max-width:100%}
.lead .tx{padding:14px 16px 16px;display:grid;gap:6px}
.lead h2{font-size:21px;line-height:1.45;margin:0;font-weight:700;text-wrap:balance}
.lead p{margin:0;color:var(--sub);font-size:14.5px}

.list{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 96px;gap:14px;align-items:start;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row .tx{min-width:0;display:grid;gap:4px}
.row h3{font-size:16px;line-height:1.5;margin:0;font-weight:700}
.row .th{width:96px;height:96px;border-radius:10px}
.row .th .credit{font-size:9px;padding:2px 5px}
.row.read h3,.lead.read h2{color:var(--sub);font-weight:500}
.dot-new{display:inline-block;font-size:10.5px;font-weight:700;color:var(--lamp-ink);border:1px solid var(--lamp);border-radius:4px;padding:0 5px;line-height:1.5}

.section-h{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin:26px 0 8px}
.back-issues{display:flex;flex-wrap:wrap;gap:8px}
.back-issues button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.back-issues button[aria-current="true"]{border-color:var(--lamp);color:var(--lamp-ink);font-weight:700}
.foot{margin-top:28px;font-size:12px;color:var(--sub);text-align:center}

.article{display:grid;gap:14px}
.backbtn{justify-self:start;display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:6px 2px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.backbtn svg{width:20px;height:20px}
.article .hero .th{aspect-ratio:16/9;border-radius:14px;max-width:100%}
.article h1{font-size:24px;line-height:1.45;margin:0;text-wrap:balance}
.article .lede{margin:0;font-size:15px;color:var(--sub);font-weight:500}
.body{display:grid;gap:16px;font-size:16.5px;line-height:1.85}
.body p{margin:0}
.point{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.point h4{margin:0 0 6px;font-size:13px;letter-spacing:.06em;color:var(--lamp-ink)}
.point ul{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:15.5px;line-height:1.65}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat div{border-radius:12px;padding:12px 14px;color:#fff;display:grid;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.3;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:12.5px;opacity:.9;line-height:1.4}
.figure{margin:0;display:grid;gap:6px}
.figure img{border-radius:12px;width:100%;background:var(--card);border:1px solid var(--line)}
.figure figcaption{font-size:12.5px;color:var(--sub);line-height:1.5}
.figure figcaption a{color:var(--sub)}
.figure img{cursor:zoom-in}
/* gallery: horizontal strip of more pictures */
.gallery{display:grid;gap:8px;min-width:0}
.gallery h4{margin:0;font-size:13px;letter-spacing:.06em;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.gallery h4 span{font-weight:500;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));padding-inline:max(16px, env(safe-area-inset-left,0px));scrollbar-width:thin}
.strip figure{flex:none;margin:0;scroll-snap-align:start;width:min(72vw,300px);display:grid;gap:4px}
.strip img{width:100%;height:180px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:zoom-in}
.strip figcaption{font-size:11.5px;line-height:1.45;color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* lightbox */
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(8,10,16,.92);display:grid;grid-template-rows:1fr auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px));color:#fff}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;margin:auto;align-self:center}
.lightbox p{margin:10px 0 0;font-size:13px;line-height:1.55;text-align:center;opacity:.9}
.lightbox p a{color:#fff}
.lightbox button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.srcbtn{display:flex;justify-content:center;align-items:center;gap:6px;text-decoration:none;background:var(--ink);color:var(--paper);border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px}
.srcbtn svg{width:18px;height:18px}
.srcnote{font-size:12px;color:var(--sub);margin:0;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .view{animation:fade .18s ease-out}
  .view.from-right{animation:fromR .22s ease-out}
  .view.from-left{animation:fromL .22s ease-out}
  .view.bump-l{animation:bumpL .25s ease-out}
  .view.bump-r{animation:bumpR .25s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes fromR{from{opacity:.3;transform:translateX(36px)}to{opacity:1;transform:none}}
  @keyframes fromL{from{opacity:.3;transform:translateX(-36px)}to{opacity:1;transform:none}}
  @keyframes bumpL{40%{transform:translateX(-10px)}to{transform:none}}
  @keyframes bumpR{40%{transform:translateX(10px)}to{transform:none}}
}
main{overflow-x:hidden}
.swipe-hint{font-size:11.5px;color:var(--sub);text-align:center;margin:-6px 0 12px}
@media (prefers-reduced-motion:reduce){.reload.spin svg{animation:none}}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="mast-row">
      <h1 class="logo"><span class="lamp" aria-hidden="true"></span>マイ夕刊</h1>
      <div class="mast-right">
        <div class="edition" id="edition"><b>読み込み中</b>毎日夕方5時ごろ更新</div>
        <button class="reload" id="reload" aria-label="最新の号を読み込む"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      </div>
    </div>
    <nav class="chips" id="chips" aria-label="ジャンル"></nav>
  </div>
</header>
<main><div class="wrap" id="app">
  <div class="state" id="loading">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h13v14a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v9a2 2 0 0 1-2 2"/><path d="M7 9h7M7 12.5h7M7 16h4"/></svg>
    <h2>今日の夕刊を取りに行っています</h2>
    <p>AI・テック、家電・新商品、副業・ネット販売のニュースが並びます。</p>
  </div>
</div></main>

<script>
(function(){
  const CATS = {
    all:{label:"すべて"},
    ai:{label:"AI・テック", c1:"--ai", c2:"--ai2"},
    kaden:{label:"家電・新商品", c1:"--kaden", c2:"--kaden2"},
    fukugyo:{label:"副業・ネット販売", c1:"--fuku", c2:"--fuku2"}
  };
  const ICONS = {
    ai:'<path d="M10 3l1.9 4.6L16.5 9l-4.6 1.4L10 15l-1.9-4.6L3.5 9l4.6-1.4z"/><path d="M17.5 13l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>',
    chip:'<rect x="6" y="6" width="12" height="12" rx="1.5"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
    phone:'<rect x="6.5" y="2" width="11" height="20" rx="2.5"/><path d="M10.5 18.5h3"/>',
    pc:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>',
    tv:'<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M8 2.5l4 3.5 4-3.5"/>',
    appliance:'<rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="13.5" r="4.2"/><path d="M8 5.5h2.5"/><circle cx="16" cy="5.5" r=".6"/>',
    camera:'<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.6"/><path d="M8.5 7l1.6-3h3.8l1.6 3"/>',
    audio:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="7" rx="1.2"/><rect x="16.5" y="14" width="4.5" height="7" rx="1.2"/>',
    game:'<rect x="2" y="7" width="20" height="11" rx="5.5"/><path d="M6.5 12.5h4M8.5 10.5v4"/><circle cx="15.5" cy="11" r=".9"/><circle cx="17.8" cy="14" r=".9"/>',
    cart:'<path d="M2.5 4h2.3l2.4 11h10.6l2.2-8H6"/><circle cx="9" cy="19.2" r="1.5"/><circle cx="16.8" cy="19.2" r="1.5"/>',
    yen:'<path d="M6.5 3.5l5.5 8 5.5-8M12 11.5V21M7.5 13.5h9M7.5 17h9"/>',
    box:'<path d="M3 7.5l9-4.5 9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9M7.5 5.2l9 4.5"/>',
    globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/>',
    chart:'<path d="M4 3v17h17"/><path d="M8 16v-4M12.5 16V8M17 16v-7"/>',
    doc:'<path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5M9 12h6.5M9 15.5h6.5"/>',
    lock:'<rect x="5" y="10.5" width="14" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5M12 14.5v2.5"/>',
    car:'<path d="M3 16.5v-3l2.2-5h13.6l2.2 5v3z"/><path d="M3 13.5h18"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/>',
    spark:'<path d="M13.5 2L5 13.5h6.5L10.5 22 19 10.5h-6.5z"/>'
  };
  const CAT_ICON = {ai:"ai", kaden:"appliance", fukugyo:"cart"};
  const WD = ["日","月","火","水","木","金","土"];

  let editions = [];      // [{date, ...}] newest first; articles loaded lazily
  let currentDate = null;
  let filter = "all";
  let readSet = new Set();
  const failedImg = new Set();
  try{ readSet = new Set(JSON.parse(localStorage.getItem("yukan-read")||"[]")); }catch(e){}
  try{ const f = localStorage.getItem("yukan-filter"); if(f && CATS[f]) filter = f; }catch(e){}

  const app = document.getElementById("app");
  const chipsEl = document.getElementById("chips");
  const editionEl = document.getElementById("edition");
  const reloadBtn = document.getElementById("reload");

  function el(tag, attrs, ...kids){
    const n = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==="class") n.className = attrs[k];
      else if(k==="text") n.textContent = attrs[k];
      else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    for(const k of kids){ if(k!=null) n.append(k); }
    return n;
  }
  function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#555"; }
  function hash(s){ let h=2166136261; for(const ch of String(s)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
  function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function isHttps(u){ return typeof u==="string" && /^https:\/\/[^\s"'<>]+$/.test(u); }
  function dateLabel(d){
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d||""); if(!m) return d||"";
    const dt = new Date(+m[1], +m[2]-1, +m[3]);
    return `${+m[2]}月${+m[3]}日（${WD[dt.getDay()]}）`;
  }
  function shortDate(d){ const m=/^\d{4}-(\d{2})-(\d{2})/.exec(d||""); return m?`${+m[1]}/${+m[2]}`:(d||""); }
  function catOf(a){ return CATS[a.category] ? a.category : "ai"; }
  function creditText(img){
    if(!img) return "";
    const who = img.credit || "";
    return img.kind==="press" ? `画像提供：${who}` : `画像：${who}`;
  }

  /* Generated illustration: category colors, seeded pattern, line icon, big kicker word */
  function illus(a, shape){
    const cat = catOf(a), C = CATS[cat];
    const c1 = cssVar(C.c1), c2 = cssVar(C.c2);
    const v = a.visual || {};
    const icon = ICONS[v.icon] || ICONS[CAT_ICON[cat]];
    const kicker = (v.kicker || C.label).slice(0, 10);
    const h = hash(a.id || a.title);
    const W = shape==="wide" ? 320 : 100, H = shape==="wide" ? 180 : 100;
    const gid = "g"+h.toString(36)+shape+Math.random().toString(36).slice(2,6), pid = "p"+gid;
    const kind = h % 3, ang = (h>>3) % 2 ? 45 : -45;
    let pat;
    if(kind===0) pat = `<pattern id="${pid}" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity=".16"/></pattern>`;
    else if(kind===1) pat = `<pattern id="${pid}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})"><rect width="4" height="10" fill="#fff" fill-opacity=".08"/></pattern>`;
    else pat = `<pattern id="${pid}" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1"/></pattern>`;
    const ring = (h>>5)%2 ? `<circle cx="${W*0.82}" cy="${H*0.18}" r="${H*0.55}" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="${shape==='wide'?18:7}"/>` : `<circle cx="${W*0.9}" cy="${H*0.95}" r="${H*0.6}" fill="#fff" fill-opacity=".08"/>`;
    let inner;
    if(shape==="wide"){
      const fs = kicker.length<=5 ? 44 : kicker.length<=7 ? 36 : 29;
      inner = `<g transform="translate(206 26) scale(5.2)" fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">${icon}</g>
        <text x="20" y="34" fill="#fff" fill-opacity=".85" font-family="Zen Kaku Gothic New, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5">${esc(C.label)}</text>
        <text x="20" y="${H-24}" fill="#fff" font-family="Dela Gothic One, sans-serif" font-size="${fs}">${esc(kicker)}</text>`;
    }else{
      const k = kicker.slice(0,6);
      const fs = k.length<=3 ? 19 : k.length<=4 ? 16 : k.length<=5 ? 13.5 : 11.5;
      inner = `<g transform="translate(29 14) scale(1.75)" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${icon}</g>
        <text x="50" y="86" text-anchor="middle" fill="#fff" font-family="Dela Gothic One, sans-serif" font-size="${fs}">${esc(k)}</text>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(kicker)}">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>${pat}</defs>
      <rect width="${W}" height="${H}" fill="url(#${gid})"/><rect width="${W}" height="${H}" fill="url(#${pid})"/>${ring}${inner}</svg>`;
  }

  /* Thumbnail: real photo (with credit) when available, generated illustration otherwise or if it fails to load */
  function thumb(a, shape){
    const box = el("div",{class:"th"});
    const img = a.image;
    const fallback = ()=>{ box.innerHTML = illus(a, shape); };
    if(img && isHttps(img.src) && !failedImg.has(img.src)){
      const pic = el("img",{src:img.src, alt:"", loading:shape==="wide"?"eager":"lazy", decoding:"async", referrerpolicy:"no-referrer"});
      pic.addEventListener("error", ()=>{ failedImg.add(img.src); fallback(); }, {once:true});
      pic.addEventListener("load", ()=>{ if(pic.naturalWidth < 40){ failedImg.add(img.src); fallback(); } }, {once:true});
      box.append(pic);
      if(img.credit) box.append(el("span",{class:"credit",text:creditText(img)}));
    }else fallback();
    return box;
  }

  function markRead(id){
    readSet.add(id);
    try{ localStorage.setItem("yukan-read", JSON.stringify([...readSet].slice(-400))); }catch(e){}
  }
  function edition(){ return editions.find(e=>e.date===currentDate) || editions[0]; }

  function renderChips(arts){
    chipsEl.replaceChildren();
    for(const key of Object.keys(CATS)){
      const n = key==="all" ? arts.length : arts.filter(a=>catOf(a)===key).length;
      chipsEl.append(el("button",{class:"chip","aria-pressed":String(filter===key),onclick:()=>{
        const from = ORDER.indexOf(filter), to = ORDER.indexOf(key);
        setFilter(key, to>from ? 1 : to<from ? -1 : 0);
      }}, CATS[key].label, el("span",{class:"n",text:String(n)})));
    }
    // keep the selected chip visible in the chip row
    const on = chipsEl.querySelector('[aria-pressed="true"]');
    if(on){
      const target = on.offsetLeft - (chipsEl.clientWidth - on.offsetWidth)/2;
      chipsEl.scrollTo({left:Math.max(0,target), behavior: reduceMotion ? "auto" : "smooth"});
    }
  }

  /* Category switching (chips or horizontal swipe) */
  const ORDER = Object.keys(CATS);
  const reduceMotion = (()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();
  function setFilter(key, dir){
    if(!CATS[key] || key===filter) return;
    filter = key; try{localStorage.setItem("yukan-filter",key);}catch(e){}
    render();
    const v = app.querySelector(".view");
    if(v && dir && !reduceMotion){ v.classList.add(dir>0 ? "from-right" : "from-left"); }
    if(window.scrollY > 0) window.scrollTo(0, 0);
  }
  (function swipe(){
    let sx=0, sy=0, st=0, tracking=false, decided=false, horizontal=false;
    const area = document.querySelector("main");
    area.addEventListener("touchstart", e=>{
      tracking = false;
      if(e.touches.length!==1 || /^#a-/.test(location.hash) || !editions.length) return;
      const t = e.touches[0];
      // leave the screen edges to the system's back/forward gesture
      if(t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
      sx=t.clientX; sy=t.clientY; st=Date.now(); tracking=true; decided=false; horizontal=false;
    }, {passive:true});
    area.addEventListener("touchmove", e=>{
      if(!tracking || decided) return;
      const t = e.touches[0], dx = t.clientX-sx, dy = t.clientY-sy;
      if(Math.abs(dx) > 12 || Math.abs(dy) > 12){ decided = true; horizontal = Math.abs(dx) > Math.abs(dy)*1.4; if(!horizontal) tracking=false; }
    }, {passive:true});
    area.addEventListener("touchend", e=>{
      if(!tracking || !horizontal) { tracking=false; return; }
      tracking=false;
      const t = e.changedTouches[0], dx = t.clientX-sx, dy = t.clientY-sy;
      if(Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)*1.4 || Date.now()-st > 800) return;
      const dir = dx < 0 ? 1 : -1;   // swipe left = next category
      const i = ORDER.indexOf(filter) + dir;
      if(i < 0 || i >= ORDER.length){ bump(dir); return; }
      try{ localStorage.setItem("yukan-swiped","1"); }catch(e){}
      setFilter(ORDER[i], dir);
    }, {passive:true});
    area.addEventListener("touchcancel", ()=>{ tracking=false; }, {passive:true});
    function bump(dir){
      if(reduceMotion) return;
      const v = app.querySelector(".view"); if(!v) return;
      v.classList.remove("bump-l","bump-r"); void v.offsetWidth;
      v.classList.add(dir>0 ? "bump-l" : "bump-r");
    }
  })();
  function renderEditionHead(ed){
    editionEl.replaceChildren(el("b",{text: ed ? `${dateLabel(ed.date)}の号` : "まだ届いていません"}), ed && editions[0] && ed.date!==editions[0].date ? "過去の号を表示中" : "毎日夕方5時ごろ更新");
  }

  function renderList(){
    const ed = edition();
    renderEditionHead(ed);
    if(!ed){
      chipsEl.replaceChildren();
      app.replaceChildren(el("div",{class:"state view"},
        el("h2",{text:"今日の夕刊はまだ届いていません"}),
        el("p",{text:"毎日夕方5時ごろ、AI・テック、家電・新商品、副業・ネット販売のニュースがここに届きます。"})));
      return;
    }
    if(!ed.articles){ loadEdition(ed.date).then(render); return; }
    const arts = ed.articles;
    renderChips(arts);
    const shown = filter==="all" ? arts : arts.filter(a=>catOf(a)===filter);
    const frag = el("div",{class:"view"});
    let hinted = false; try{ hinted = localStorage.getItem("yukan-swiped")==="1"; }catch(e){}
    if(!hinted && "ontouchstart" in window) frag.append(el("p",{class:"swipe-hint",text:"左右にスワイプするとジャンルを切り替えられます"}));
    if(!shown.length){
      frag.append(el("div",{class:"state"}, el("h2",{text:"この号には該当するニュースがありません"}), el("p",{text:"ほかのジャンルを選んでみてください。"})));
    }else{
      const [lead, ...rest] = shown;
      const open = a => ()=>{ location.hash = "a-"+a.id; };
      const meta = a => el("div",{class:"meta"}, el("span",{class:"cat "+catOf(a),text:CATS[catOf(a)].label}), el("span",{text:a.source_name||""}), readSet.has(a.id)?null:el("span",{class:"dot-new",text:"未読"}));
      frag.append(el("button",{class:"lead"+(readSet.has(lead.id)?" read":""),onclick:open(lead)},
        thumb(lead,"wide"),
        el("div",{class:"tx"}, meta(lead), el("h2",{text:lead.title}), el("p",{text:lead.summary||""}))));
      if(rest.length){
        const list = el("div",{class:"list"});
        for(const a of rest){
          list.append(el("button",{class:"row"+(readSet.has(a.id)?" read":""),onclick:open(a)},
            el("div",{class:"tx"}, meta(a), el("h3",{text:a.title})),
            thumb(a,"square")));
        }
        frag.append(list);
      }
    }
    if(editions.length>1){
      frag.append(el("div",{class:"section-h",text:"過去の号"}));
      const bi = el("div",{class:"back-issues"});
      for(const e of editions){
        bi.append(el("button",{"aria-current":String(e.date===ed.date),onclick:()=>{currentDate=e.date; render(); window.scrollTo(0,0);}}, shortDate(e.date)+(e.date===editions[0].date?"（最新）":"")));
      }
      frag.append(bi);
    }
    if(ed.updatedAt){
      const t = new Date(ed.updatedAt);
      if(!isNaN(t)) frag.append(el("p",{class:"foot",text:`${t.getMonth()+1}月${t.getDate()}日 ${t.getHours()}:${String(t.getMinutes()).padStart(2,"0")} に届いた号です`}));
    }
    app.replaceChildren(frag);
  }

  function findArticle(id){
    for(const e of editions){ const a=(e.articles||[]).find(x=>x.id===id); if(a) return a; }
    return null;
  }

  function figure(b){
    if(!isHttps(b.src) || failedImg.has(b.src)) return null;
    const img = el("img",{src:b.src, alt:b.caption||"", loading:"lazy", decoding:"async", referrerpolicy:"no-referrer"});
    const cap = el("figcaption");
    if(b.caption) cap.append(b.caption, "　");
    const cr = creditText(b);
    if(cr){
      if(isHttps(b.page)) cap.append(el("a",{href:b.page,target:"_blank",rel:"noopener noreferrer",text:cr}));
      else cap.append(cr);
    }
    const fig = el("figure",{class:"figure"}, img, cap);
    img.addEventListener("error", ()=>{ failedImg.add(b.src); fig.remove(); }, {once:true});
    img.addEventListener("click", ()=>openLightbox(b));
    return fig;
  }

  function gallery(b){
    const items = (Array.isArray(b.items)?b.items:[]).filter(x=>x && isHttps(x.src) && !failedImg.has(x.src));
    if(!items.length) return null;
    const count = el("span",{text:`${items.length}枚`});
    const strip = el("div",{class:"strip"});
    const wrap = el("div",{class:"gallery"}, el("h4",null, b.title || "画像", count), strip);
    const update = ()=>{ const n = strip.children.length; count.textContent = `${n}枚`; if(!n) wrap.remove(); };
    for(const x of items){
      const img = el("img",{src:x.src, alt:x.caption||"", loading:"lazy", decoding:"async", referrerpolicy:"no-referrer"});
      const cap = el("figcaption",{text:[x.caption, creditText(x)].filter(Boolean).join("　")});
      const fig = el("figure",null, img, cap);
      img.addEventListener("error", ()=>{ failedImg.add(x.src); fig.remove(); update(); }, {once:true});
      img.addEventListener("click", ()=>openLightbox(x));
      strip.append(fig);
    }
    return wrap;
  }

  let lightboxEl = null;
  function closeLightbox(){ if(lightboxEl){ lightboxEl.remove(); lightboxEl = null; } }
  function openLightbox(x){
    closeLightbox();
    const p = el("p");
    if(x.caption) p.append(x.caption, "　");
    const cr = creditText(x);
    if(cr){ if(isHttps(x.page)) p.append(el("a",{href:x.page,target:"_blank",rel:"noopener noreferrer",text:cr})); else p.append(cr); }
    lightboxEl = el("div",{class:"lightbox",role:"dialog","aria-label":"画像の拡大表示"},
      el("img",{src:x.src, alt:x.caption||"", referrerpolicy:"no-referrer"}), p,
      el("button",{"aria-label":"閉じる",onclick:(e)=>{ e.stopPropagation(); closeLightbox(); }}, "×"));
    lightboxEl.addEventListener("click", (e)=>{ if(e.target.tagName!=="A") closeLightbox(); });
    document.body.append(lightboxEl);
  }
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeLightbox(); });
  window.addEventListener("hashchange", closeLightbox);

  function renderArticle(a){
    markRead(a.id);
    const cat = catOf(a), C = CATS[cat];
    const c1 = cssVar(C.c1), c2 = cssVar(C.c2);
    const body = el("div",{class:"body"});
    for(const b of (a.body||[])){
      if(!b || typeof b!=="object") continue;
      if(b.type==="p" && b.text) body.append(el("p",{text:b.text}));
      else if(b.type==="point" && Array.isArray(b.items) && b.items.length){
        const ul = el("ul"); b.items.forEach(t=>ul.append(el("li",{text:t})));
        body.append(el("div",{class:"point"}, el("h4",{text:"ここがポイント"}), ul));
      }
      else if(b.type==="stat" && Array.isArray(b.items) && b.items.length){
        const s = el("div",{class:"stat"});
        b.items.slice(0,4).forEach((it,i)=>{
          const box = el("div",null, el("b",{text:it.value||""}), el("span",{text:it.label||""}));
          box.style.background = i%2 ? c2 : c1;
          s.append(box);
        });
        body.append(s);
      }
      else if(b.type==="img"){ const f = figure(b); if(f) body.append(f); }
      else if(b.type==="gallery"){ const g = gallery(b); if(g) body.append(g); }
    }
    const art = el("article",{class:"article view"},
      el("button",{class:"backbtn",onclick:()=>{ if(history.length>1 && location.hash) history.back(); else location.hash=""; }},
        svgIcon('<path d="M15 5l-7 7 7 7"/>'), "一覧にもどる"),
      el("div",{class:"hero"}, thumb(a,"wide")),
      el("div",{class:"meta"}, el("span",{class:"cat "+cat,text:C.label}), el("span",{text:a.source_name||""}), a.published?el("span",{text:shortDate(a.published)+" の記事"}):null),
      el("h1",{text:a.title}),
      a.summary?el("p",{class:"lede",text:a.summary}):null,
      body
    );
    if(isHttps(a.source_url)){
      art.append(el("a",{class:"srcbtn",href:a.source_url,target:"_blank",rel:"noopener noreferrer"}, "元の記事を読む（"+(a.source_name||"出典")+"）", svgIcon('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>')));
      art.append(el("p",{class:"srcnote",text:"文章はマイ夕刊による要約です。画像は表示中の出典元のもので、詳しい内容は元の記事で確認できます。"}));
    }
    app.replaceChildren(art);
    window.scrollTo(0,0);
  }
  function svgIcon(d){
    const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
    s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor");
    s.setAttribute("stroke-width","2"); s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round"); s.setAttribute("aria-hidden","true");
    s.innerHTML = d; return s;
  }

  let lastListScroll = 0;
  function render(){
    const m = /^#a-(.+)$/.exec(location.hash);
    if(m && editions.length){
      const a = findArticle(decodeURIComponent(m[1]));
      if(a){ chipsEl.hidden = true; renderArticle(a); return; }
    }
    chipsEl.hidden = false;
    renderList();
  }
  window.addEventListener("hashchange", ()=>{
    const toArticle = /^#a-/.test(location.hash);
    if(toArticle) lastListScroll = window.scrollY;
    render();
    if(!toArticle) requestAnimationFrame(()=>window.scrollTo(0,lastListScroll));
  });
  try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ if(editions.length) render(); }); }catch(e){}

  function showProblem(title, text){
    renderEditionHead(null);
    app.replaceChildren(el("div",{class:"state view"}, el("h2",{text:title}), el("p",{text:text})));
  }

  async function getJSON(path){
    const r = await fetch(path + "?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }
  async function loadEdition(date){
    const e = editions.find(x=>x.date===date);
    if(!e || e.articles) return;
    try{
      const d = await getJSON(`data/${date}.json`);
      Object.assign(e, d, {date, articles: Array.isArray(d.articles)?d.articles:[]});
    }catch(err){ e.articles = []; }
  }
  async function loadAll(){
    reloadBtn.classList.add("spin");
    try{
      const idx = await getJSON("data/index.json");
      const dates = (Array.isArray(idx.editions)?idx.editions:[]).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort().reverse().slice(0,14);
      const old = new Map(editions.map(e=>[e.date,e]));
      editions = dates.map(d=> old.get(d) && old.get(d).articles ? old.get(d) : {date:d});
      if(currentDate && !dates.includes(currentDate)) currentDate = null;
      if(editions[0]) await loadEdition(editions[0].date);
      const m = /^#a-(.+)$/.exec(location.hash);
      if(m && !findArticle(decodeURIComponent(m[1]))) for(const e of editions){ await loadEdition(e.date); if(findArticle(decodeURIComponent(m[1]))) break; }
      render();
    }catch(err){
      if(!editions.length) showProblem("ニュースを読み込めませんでした","通信の状態を確認して、右上の更新ボタンを押してください。");
    }finally{ reloadBtn.classList.remove("spin"); }
  }
  reloadBtn.addEventListener("click", ()=>{ editions.forEach(e=>{ if(e.date===editions[0]?.date) delete e.articles; }); loadAll(); });
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && !/^#a-/.test(location.hash)) loadAll(); });
  loadAll();
})();
</script>
</body>
</html>
