function marks(s,warn){const m=new Array(s.length).fill(C.capText);
  const paint=(re,col)=>{re.lastIndex=0;let x;while((x=re.exec(s)))for(let i=x.index;i<x.index+x[0].length;i++)m[i]=col;};
  paint(/[0-9][0-9.,万円ニトコマ倍月日秒%+]*/g,C.capNum); if(warn)paint(/ただし|宣伝/g,C.warn); return m;}
function splitLine(s){const pt='をにはがでとのもへ、';const brk=[];for(let i=2;i<s.length-1;i++){if(pt.includes(s[i-1])&&!pt.includes(s[i]))brk.push(i);} // never start a line with a particle
  if(!brk.length)return [s.slice(0,Math.ceil(s.length/2)),s.slice(Math.ceil(s.length/2))];
  const mid=s.length/2;const b=brk.sort((a,b)=>Math.abs(a-mid)-Math.abs(b-mid))[0];return [s.slice(0,b),s.slice(b)];}
function caption(s,y,k,warn){let size=66;g.font=`900 ${size}px ${FONT}`;let lines=[s];
  if(g.measureText(s).width>MAXW){lines=splitLine(s);}
  for(const L of lines){g.font=`900 ${size}px ${FONT}`;const w=g.measureText(L).width;if(w>MAXW)size=Math.floor(size*MAXW/w);}
  const lh=size*1.22, y0=y-(lines.length-1)*lh/2, sc=0.94+0.06*ease(k/0.12*1);
  g.save();g.globalAlpha*=clamp(k/0.08);g.translate(CX,y);g.scale(sc,sc);g.translate(-CX,-y);
  let off=0;lines.forEach((L,li)=>{g.font=`900 ${size}px ${FONT}`;const m=marks(s,warn).slice(off,off+L.length);off+=L.length;
    const w=g.measureText(L).width;let x=CX-w/2;const yy=y0+li*lh;
    // two passes: every edge first, then every letter, so a letter's edge never covers its neighbour
    const xs=[];for(let i=0;i<L.length;i++){xs.push(x);x+=g.measureText(L[i]).width;}
    g.save();g.textAlign='left';g.textBaseline='middle';g.lineJoin='round';g.shadowColor=C.capShadow;g.shadowBlur=14;g.shadowOffsetY=5;g.lineWidth=size*0.24;g.strokeStyle=C.capEdge;
    for(let i=0;i<L.length;i++)g.strokeText(L[i],xs[i],yy);g.restore();
    g.textAlign='left';g.textBaseline='middle';for(let i=0;i<L.length;i++){g.fillStyle=m[i];g.fillText(L[i],xs[i],yy);}});
  g.restore();}

// ---------- speech bubble: the caption is Rina's line, right next to her (x370-915, y1165-1440 stays clear of the Shorts buttons and title) ----------
const BX=372,BY=1165,BW=543,BH=275,BCX=BX+BW/2+6,BMAXW=BW-70;
function bubblePath(){g.beginPath();g.moveTo(BX+44,BY);g.lineTo(BX+BW-44,BY);g.arcTo(BX+BW,BY,BX+BW,BY+44,44);g.lineTo(BX+BW,BY+BH-44);g.arcTo(BX+BW,BY+BH,BX+BW-44,BY+BH,44);
  g.lineTo(BX+44,BY+BH);g.arcTo(BX,BY+BH,BX,BY+BH-44,44);g.lineTo(BX,BY+178);g.lineTo(BX-40,BY+150);g.lineTo(BX,BY+120);g.lineTo(BX,BY+44);g.arcTo(BX,BY,BX+44,BY,44);g.closePath();}
function bubble(){abs(()=>{g.save();g.shadowColor=C.cardShadow||'rgba(0,0,0,0.2)';g.shadowBlur=24;g.shadowOffsetY=8;bubblePath();g.fillStyle='#FFFFFF';g.fill();g.restore();
  bubblePath();g.lineWidth=7;g.strokeStyle=C.brand;g.lineJoin='round';g.stroke();});}
// line breaks only at word boundaries (Intl.Segmenter), never before a particle or punctuation; 2 lines, 3 if needed to stay big
const SEG=new Intl.Segmenter('ja',{granularity:'word'});const NOSTART='、。」』）をにはがでとのもへやかよねっゃゅょぁぃぅぇぉーんてただ';
function wrapJa(s,size,maxw){g.font=`900 ${size}px ${FONT}`;const cuts=[0];let i=0;const KANJI=/[\u4e00-\u9fff々]/,HIRA=/[\u3041-\u309f]/;for(const x of SEG.segment(s)){i+=x.segment.length;if(i<s.length&&!NOSTART.includes(s[i])&&!(KANJI.test(s[i-1])&&HIRA.test(s[i])))cuts.push(i);}for(let j=1;j<s.length;j++)if('をにはがでとのもへやよね、。てば'.includes(s[j-1])&&!NOSTART.includes(s[j]))cuts.push(j);
  const keep=j=>j>=3&&s.length-j>=3;  // every line keeps at least 3 characters  // also right after particles (the word splitter misses some)
  cuts.push(s.length);
  const W=t=>g.measureText(t).width;if(W(s)<=maxw)return [s];
  let best=null;const c=[...new Set(cuts)].sort((a,b)=>a-b).filter(x=>x>0&&x<s.length&&keep(x));
  const PEN=a=>(s.slice(a,a+2)==='いう'&&s[a-1]==='と')?size*0.6:('をにはがでとのもへやかよね、。てばし'.includes(s[a-1])?0:size*0.9);  // prefer breaking right after a particle
  for(const a of c){const L=[s.slice(0,a),s.slice(a)];const m=Math.max(...L.map(W));const sc=m+PEN(a);if(m<=maxw*1.15&&(!best||sc<best.sc))best={L,m,sc};}if(!best)for(const a of c){const L=[s.slice(0,a),s.slice(a)];const m=Math.max(...L.map(W));if(!best||m<best.m)best={L,m,sc:m};}
  if(best&&best.m<=maxw)return best.L;
  let b3=null;for(const a of c)for(const b of c)if(b-a>=3){const L=[s.slice(0,a),s.slice(a,b),s.slice(b)];const m=Math.max(...L.map(W));if(!b3||m<b3.m)b3={L,m};}
  return (b3&&(!best||best.m>maxw*1.12))?b3.L:(best?best.L:[s]);}
function bubbleText(s,k,warn){abs(()=>{let size=74;let lines=wrapJa(s,size,BMAXW);
  for(const L of lines){g.font=`900 ${size}px ${FONT}`;const w=g.measureText(L).width;if(w>BMAXW)size=Math.floor(size*BMAXW/w);}
  if(lines.length===3)size=Math.min(size,64);
  const lh=size*1.22,cy=BY+BH/2,y0=cy-(lines.length-1)*lh/2;g.save();g.globalAlpha*=clamp(0.5+k/0.16);
  const m=marks(s,warn);let off=0;lines.forEach((L,li)=>{g.font=`900 ${size}px ${FONT}`;const w=g.measureText(L).width;let x=BCX-w/2;
    g.textAlign='left';g.textBaseline='middle';for(let i=0;i<L.length;i++){g.fillStyle=m[off+i]===C.capText?C.ink:m[off+i];g.fillText(L[i],x,y0+li*lh);x+=g.measureText(L[i]).width;}off+=L.length;});g.restore();});}

function appIcon(kind,x,y,s,col){g.save();g.translate(x,y);rrect(-s/2,-s/2,s,s,s*0.24,col||C.brand);g.strokeStyle='#FFFFFF';g.fillStyle='#FFFFFF';g.lineWidth=s*0.07;g.lineCap='round';g.lineJoin='round';const q=s*0.26;

  else if(kind==='cart'){g.beginPath();g.moveTo(-q*1.1,-q*0.9);g.lineTo(-q*0.7,-q*0.9);g.lineTo(-q*0.4,q*0.4);g.lineTo(q*0.9,q*0.4);g.lineTo(q*1.1,-q*0.5);g.lineTo(-q*0.55,-q*0.5);g.stroke();g.beginPath();g.arc(-q*0.25,q*0.9,q*0.18,0,7);g.arc(q*0.7,q*0.9,q*0.18,0,7);g.fill();}
  else if(kind==='ticket'){g.beginPath();g.moveTo(-q*1.1,-q*0.6);g.lineTo(q*1.1,-q*0.6);g.lineTo(q*1.1,-q*0.15);g.arc(q*1.1,q*0.1,q*0.25,-Math.PI/2,Math.PI/2,true);g.lineTo(q*1.1,q*0.6);g.lineTo(-q*1.1,q*0.6);g.lineTo(-q*1.1,q*0.35);g.arc(-q*1.1,q*0.1,q*0.25,Math.PI/2,-Math.PI/2,true);g.closePath();g.stroke();}
  else if(kind==='plane'){g.beginPath();g.moveTo(-q*1.1,q*0.1);g.lineTo(q*1.1,-q*0.2);g.moveTo(-q*0.1,-q*0.05);g.lineTo(-q*0.6,-q*0.9);g.moveTo(q*0.1,-q*0.1);g.lineTo(q*0.2,q*0.8);g.stroke();}
  else if(kind==='mail'){g.strokeRect(-q,-q*0.7,2*q,1.4*q);g.beginPath();g.moveTo(-q,-q*0.7);g.lineTo(0,q*0.15);g.lineTo(q,-q*0.7);g.stroke();}
  else if(kind==='pin'){g.beginPath();g.arc(0,-q*0.2,q*0.6,Math.PI*0.85,Math.PI*0.15);g.lineTo(0,q*1.0);g.closePath();g.stroke();g.beginPath();g.arc(0,-q*0.2,q*0.2,0,7);g.fill();}
  else if(kind==='gift'){g.strokeRect(-q*0.9,-q*0.3,1.8*q,1.2*q);g.beginPath();g.moveTo(0,-q*0.3);g.lineTo(0,q*0.9);g.moveTo(-q,-q*0.3);g.lineTo(q,-q*0.3);g.stroke();g.beginPath();g.ellipse(-q*0.35,-q*0.6,q*0.35,q*0.2,0.5,0,7);g.ellipse(q*0.35,-q*0.6,q*0.35,q*0.2,-0.5,0,7);g.stroke();}
  else if(kind==='chat'){g.beginPath();g.roundRect(-q*1.05,-q*0.8,2.1*q,1.4*q,q*0.4);g.stroke();g.beginPath();g.moveTo(-q*0.5,q*0.6);g.lineTo(-q*0.7,q*1.05);g.lineTo(-q*0.05,q*0.6);g.stroke();}
  g.restore();}

   creditAt('出典：Meta（公式動画）',940,1090);},
 // L4 auto: connect apps -> the table updates itself
 auto(u,d,L){bg(u);mini(u);const ta=telHas(L,'アプリ'),tp=telHas(L,'値段'),tr=telHas(L,'頼まなくても');

   // arrows into the table
   if(u>ta+0.5){const a=ease((u-ta-0.5)/0.4);g.save();g.globalAlpha*=a;g.strokeStyle=C.sub;g.lineWidth=6;g.setLineDash([12,12]);g.lineDashOffset=-u*40;for(let j=0;j<4;j++){g.beginPath();g.moveTo(300,500+j*150);g.lineTo(390,725);g.stroke();}g.restore();}
   withEnter(enter(u,0.1),()=>{rrect(400,470,560,520,30,C.card);text('旅行の計画',440,525,38,C.text,'left',900);text('※イメージ',925,525,24,C.sub,'right',700);
     const rows=[['ホテル','¥18,000'],['ライブ','12月20日'],['航空券','¥42,000'],['予算','残り¥60,000']];
     rows.forEach(([a,b],j)=>{const y=610+j*95;g.fillStyle=C.bar;g.fillRect(430,y-47,500,2);text(a,445,y,34,C.sub,'left',800);
       let val=b,hl=0;
       if(j===0&&u>tp+0.2){hl=clamp((u-tp-0.2)/0.3);val='¥15,800';}
       if(j===1&&u>tr+0.1){hl=clamp((u-tr-0.1)/0.3);val='12/20・12/21';}
       if(hl>0){g.save();g.globalAlpha*=hl*(0.55+0.45*Math.abs(Math.sin((u)*4)))*0.35;rrect(600,y-36,345,72,14,C.acc);g.restore();}
       text(val,930,y,38,hl>0?C.acc:C.text,'right',900);
       if(hl>0){g.save();g.globalAlpha*=hl;text(j===0?'値下がり':'追加',610,y-30,22,C.acc,'left',900);g.restore();}});});
   if(u>tr){const k=back((u-tr)/0.35);g.save();g.translate(680,1050);g.scale(k,k);rrect(-150,-44,300,88,44,C.brand);text('↻ 自動で更新',0,0,40,'#FFFFFF');g.restore();}},
 // L5 but: more apps = AI sees more
 twist(u,d,L){bg(u);mini(u);const tb=telHas(L,'AIに');
   const st=ease(u/0.25);g.save();g.translate(CX,395);g.rotate(-0.05);g.scale(1.35-0.35*st,1.35-0.35*st);g.globalAlpha=st;rrect(-140,-52,280,104,20,C.warn);text('ただし',0,0,66,'#FFFFFF');g.restore();
   // apps -> AI eye; info cards pile up
   const ks=['cal','cart','ticket','mail','pin','chat'];
   ks.forEach((k,j)=>withEnter(enter(u,0.3+j*0.18),()=>appIcon(k,200+(j%3)*130,560+Math.floor(j/3)*140,96,C.bar),16));
   withEnter(enter(u,0.5),()=>{g.save();g.translate(780,630);g.beginPath();g.arc(0,0,120,0,7);g.fillStyle=C.card;g.fill();g.lineWidth=6;g.strokeStyle=C.brand;g.stroke();
     g.beginPath();g.ellipse(0,0,74,40,0,0,7);g.fillStyle='#FFFFFF';g.fill();g.lineWidth=7;g.stroke();g.beginPath();g.arc(0,0,22,0,7);g.fillStyle=C.brand;g.fill();text('AI',0,90,30,C.brand);g.restore();});
   if(u>0.8){g.save();g.strokeStyle=C.warn;g.lineWidth=7;g.lineCap='round';const a=ease((u-0.8)/0.5);g.globalAlpha*=a;g.beginPath();g.moveTo(520,630);g.lineTo(640,630);g.moveTo(620,610);g.lineTo(640,630);g.lineTo(620,650);g.stroke();g.restore();}
   if(u>1.0){for(let j=0;j<4;j++){const p=((u-1.0)*0.9+j*0.25)%1;const x=540+p*120,y=630+(j%2?-1:1)*(1-p)*40;g.save();g.globalAlpha*=Math.sin(p*Math.PI);rrect(x-18,y-24,36,48,6,'#FFFFFF',C.warn);g.restore();}}
   withEnter(enter(u,tb),()=>{rrect(136,820,808,220,26,C.card);text('つなぐアプリが多いほど',CX,885,44,C.text);text('AIに見せる情報も増える',CX,965,52,C.warn);});},
 // L6 verdict
 verdict(u,d,L){bg(u);glow(CX,1250,600,C.brand,0.32);drawChar(CUR,18,510,1044,1856);const t2=telHas(L,'つなぐ');
   const k1=back((u-0.1)/0.35),k2=back((u-t2)/0.35);
   if(u>0.1){g.save();g.translate(333,465);g.scale(k1,k1);rrect(-197,-115,394,230,32,C.card2,C.brand);
     text('日本でも',0,-62,38,'#CDD8EC','center',800);text('使える',0,8,70,'#FFFFFF');text('まずは無料で1つ',0,76,36,'#FFB074','center',900);g.restore();}
   if(u>t2){g.save();g.translate(747,465);g.scale(k2,k2);rrect(-197,-115,394,230,32,C.buyFill);
     text('つなぐアプリ',0,-58,38,C.buyInk,'center',800);text('必要な',0,12,62,C.buyInk);text('ものだけ',0,74,40,C.buyInk,'center',800);g.restore();}},
 logo(u){g.fillStyle=C.bg0;g.fillRect(0,0,W,H);const k=ease(u/0.25);g.globalAlpha=k;const i=IMG.logo;
   if(i){const w=860,h=w*i.height/i.width,sc=0.92+0.08*back(u/0.4);g.save();g.translate(CX,860);g.scale(sc,sc);g.drawImage(i,-w/2,-h/2,w,h);g.restore();}
   text('AI・ガジェット・家電のニュース',CX,1060,44,C.sub,'center',800);g.globalAlpha=1;},

window.render=async function(t){
  CUR=await charImg(Math.round(origT(t)*P.fps));
  {const L=P.lines.find(x=>x.scene==='how');if(L&&t>=L.start-0.2&&t<L.end+0.2){const u=Math.max(0,t-L.start),tc=telHas(L,'チャット'),tm=telHas(L,'Museが');UICUR=await uiImg(u<tc?310+u*30:u<tm?Math.min(258,236+(u-tc)*12):330+(u-tm)*20);}}
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.fillStyle=C.bg1;g.fillRect(0,0,W,H);
  let cur=P.lines.length-1;for(let i=0;i<P.lines.length;i++){if(t<(P.lines[i+1]?P.lines[i+1].start:1e9)){cur=i;break;}}
  if(t>=P.voice_end+0.35){S.logo(t-P.voice_end-0.35);return;}
  const L=P.lines[cur],u=Math.max(0,t-L.start),d=(P.lines[cur+1]?P.lines[cur+1].start:P.voice_end)-L.start;
  g.save();if(u<0.12){const s=1.03-0.03*u/0.12;g.translate(W/2,H/2);g.scale(s,s);g.translate(-W/2,-H/2);} // small punch-in on every cut
  BASE=g.getTransform();g.save();g.translate(CX,CT.y1);g.scale(CT.s,CT.s);g.translate(-CX,-CT.y0);
  S[L.scene](u,d,L);g.restore();g.restore();
  // keep the last line on screen through short pauses
  let last=null;for(const tl of P.tel){if(tl.start<=t)last=tl;else break;}if(!last)last=P.tel[0];
  const BIG=['intro','verdict'];  // presenter fills the screen: normal caption over her, no bubble
  if(BIG.includes(L.scene)){if(last&&last.start>=L.start-0.01)caption(last.text,1330,(t-last.start),false);}
  else{bubble();if(last)bubbleText(last.text,t<last.start?1:(t-last.start),L.scene==='twist');}
};
