  const paint=(re,col)=>{re.lastIndex=0;let x;while((x=re.exec(s)))for(let i=x.index;i<x.index+x[0].length;i++)m[i]=col;};
  paint(/[0-9][0-9.,万円ニトコマ倍月日秒%+]*/g,C.capNum);
  // numbers inside product names (PS5, Switch 2, iPhone 17, GPT-6, M5) stay plain: only values (price, date, count) are highlighted (2026-11-14 user decision)
  const prod=/[A-Za-z][A-Za-z+]*[ -]?([0-9][0-9.]*)(?![0-9.,万円倍月日秒%年人台本件回時分])/g;let p;
  while((p=prod.exec(s))){const st=p.index+p[0].length-p[1].length;for(let i=st;i<p.index+p[0].length;i++)m[i]=C.capText;}

// ---------- line breaks (2026-11-18): the rules of tools/shorts_rules.md「画面と字幕」are applied here, while the caption is laid out ----------
// (they used to be found only in the screen check after a 15-minute render: 259億|キロ, 6万|1000キロ, Codexに|登場, a line starting with た/だ)
// a line never starts with a particle, a small letter or the auxiliary た/だ (a word like ただし・ただ・だから may start a line after 、 or a particle);
// never break inside 「」, inside a number, between a number and its unit (259億キロ・6万1000キロ・20分の1・11月18日), inside a katakana or English word,
// before the number of a name (iPhone 17・ボイジャー1号), nor between two hiragana except right after a particle; 3+ letters a line; 2 lines, 3 only if needed.
// check_fit.js checks the result with its own copy of the rules (wrap_rules.js), so a mistake here is still caught before rendering.
const SEG=new Intl.Segmenter('ja',{granularity:'word'});
const NOSTART='、。，．,.・…」』）)】〕!！?？をにはがでとのもへやかよねっゃゅょぁぃぅぇぉゎッャュョァィゥェォヮヵヶーんてただ';

const HEAD_OK=['ただし','ただ','だから','だけど','だが','だって','たとえば','たった','たくさん','たぶん','でも','では','ところが','ところで','とても','とくに','とりあえず','もう','もし','もっと','もちろん','しかし','しかも'];
const HEAD_OK_AFTER='、。」』）!！?？ 　はがをにでともへやよねばす';   // ...but only after these (so not 来|ただけ, なん|だから, 思い|もしない)
const HEAD_FREE=['かか','かけ','かなり','かつて','かわり','でき','とき','ところ'];   // verbs and nouns that look like a particle (24時間|かかります, 予定表が|できます): may start a line anywhere
const UNITS=['時間','年間','日間','週間','分間','秒間','カ月','ヶ月','か月','ヵ月','言語','光年','光日','万円','億円','千円','兆円','万人','億人','万台','パーセント'];

const letters=t=>t.replace(/[\s、。，．,.!！?？「」『』（）()・…〜~]/g,'').length;

  while((m=re.exec(s))){const a=m.index;let b=a+m[0].length;while(b>a+1&&'.,，．:：'.includes(s[b-1]))b--;const w=UNITS.find(x=>s.startsWith(x,b));out.push([a,b,w?b+w.length:b]);}return out;}

  if(!headOK&&(NOSTART.includes(n)||NOSTART_W.some(w=>s.startsWith(w,j))))return 'head';

  for(const [a,b,u] of numSpans(s)){if(j>a&&j<b)return 'number';if(j>b&&j<u)return 'unit';if(j===b&&!'、。，．,!！?？ 　」』）'.includes(n))return 'unit';
    if(j===a&&('約第$¥＄￥#＃+＋'.includes(p)||(j>=2&&RE_DIG.test(s[j-2]))))return 'number';}   // 約|259億, 11月|18日, 7時|16分

function wrapJa(s,size,maxw,maxLines=3){g.font=`900 ${size}px ${FONT}`;const W=t=>g.measureText(t).width;if(W(s)<=maxw)return [s];

  const cand=new Set(segb);for(let j=1;j<s.length;j++)if((SOFT+'、。」』）!！?？ 　').includes(s[j-1])||HEAD_OK.some(w=>s.startsWith(w,j)))cand.add(j);   // the word splitter misses some

// the lines and the letter size of each kind of caption (check_fit.js reads them through window.WRAP_LOG)
function fitSize(lines,size,maxw){for(const L of lines){g.font=`900 ${size}px ${FONT}`;const w=g.measureText(L).width;if(w>maxw)size=Math.floor(size*maxw/w);}return size;}

function caption(s,y,k,warn){const o=captionLayout(s),lines=o.lines,size=o.size;

// giant caption over the 0 s picture (the first sentence, chunk by chunk, user 2026-11-17): white letters, thin sharp black edge, no blur (user chose style B), numbers orange
function bigTelop(s,y){s=s.replace(/[、。]$/,'');const o=telopLayout(s),lines=o.lines,size=o.size;   // at most 2 lines, never cut in half by letter count (2026-11-18)
  const lh=size*1.18,y0=y-(lines.length-1)*lh/2;const m=marks(s,false);let off=0;
  lines.forEach((L,li)=>{g.font=`900 ${size}px ${FONT}`;const w=g.measureText(L).width;let x=CX-w/2;const yy=y0+li*lh;const xs=[];for(let i=0;i<L.length;i++){xs.push(x);x+=g.measureText(L[i]).width;}
    g.save();g.textAlign='left';g.textBaseline='middle';g.lineJoin='miter';g.miterLimit=2.5;g.lineWidth=size*0.14;g.strokeStyle=C.capEdge;for(let i=0;i<L.length;i++)g.strokeText(L[i],xs[i],yy);g.restore();
    g.textAlign='left';g.textBaseline='middle';for(let i=0;i<L.length;i++){g.fillStyle=m[off+i];g.fillText(L[i],xs[i],yy);}off+=L.length;});}
// ---------- scenes (u = time in scene, d = scene length) ----------
const S={
 // L0: conclusion-first hook over a generated picture of AI building AI
 hook(u,d,L){bg(u);brandTag();mini(u);const ts=telHas(L,'そんな段階');
   mixLine([['AIが',C.text],['AIを作る',C.acc],['時代',C.text]],CX,385,62);
   withEnter(enter(u,0,0.35),()=>{g.save();g.beginPath();g.roundRect(240,450,600,600,32);g.clip();const z=1.04+0.10*u/d;const i=IMG.chain;
     if(i){const w=600*z,h=w*i.height/i.width;g.drawImage(i,CX-w/2,750-h*0.45,w,h);}g.restore();},40);
   const k=(u-ts)/0.3;if(k>0){const sc=back(k);g.save();g.translate(CX,990);g.rotate(-0.04);g.scale(sc,sc);rrect(-230,-62,460,124,28,C.acc);text('もうすぐ？',0,0,76,C.onAcc);g.restore();}},
 // L1: big presenter with the channel logo as the title
 intro(u){bg(u);glow(CX,1000,600,C.brand,0.32);drawChar(CUR,-90,298,1260,2240);
   },
 // L2: who warned, where, the key words
 what(u,d,L){bg(u);brandTag();mini(u);const tq=telHas(L,'書類');
   mixLine([['Anthropic',C.brand],['が警告',C.text]],CX,385,62);
   withEnter(enter(u,0.1),()=>{rrect(192,460,696,300,32,C.card);
     g.save();g.translate(330,610);rrect(-62,-82,124,164,14,'#FFFFFF',C.bar);g.fillStyle=C.bar;for(let i=0;i<5;i++)g.fillRect(-38,-50+i*24,i==4?44:76,8);g.restore();
     text('上場のための申請書',420,575,44,C.text,'left',900);text('（修正版・11月2日提出）',420,635,32,C.sub,'left',800);text('AI企業 Anthropic',420,690,32,C.sub,'left',800);});
   withEnter(enter(u,tq),()=>{rrect(192,800,696,250,32,C.card2);text('申請書の言葉',CX,850,34,C.sub,'center',800);
     g.save();g.translate(CX,950);const sc=back((u-tq)/0.35);g.scale(sc,sc);text('「まもなく達しうる」',0,0,64,C.acc);g.restore();});
   credit();},
 // L3: what "the threshold" means: progress twice as fast
 rsi(u,d,L){bg(u);brandTag();mini(u);const t2=telHas(L,'そこに');
   mixLine([['目安：開発のペースが',C.text],['2倍',C.acc]],CX,385,56);
   // AI -> AI -> AI, each a little bigger (the "AI builds AI" chain)
   const R=[56,72,90],X=[270,520,800];
   R.forEach((r,j)=>withEnter(enter(u,0.15+j*0.25),()=>{const pul=1+0.04*Math.sin(u*3+j);g.save();g.translate(X[j],580);g.scale(pul,pul);
     g.beginPath();g.arc(0,0,r,0,7);g.fillStyle=j==2?C.acc:C.card;g.fill();g.lineWidth=6;g.strokeStyle=j==2?C.acc:C.brand;g.stroke();text('AI',0,2,r*0.8,j==2?C.onAcc:C.brand);g.restore();
     if(j<2){const xa=X[j]+R[j]+18,xb=X[j+1]-R[j+1]-18;g.strokeStyle=C.sub;g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(xa,580);g.lineTo(xb,580);g.moveTo(xb-18,562);g.lineTo(xb,580);g.lineTo(xb-18,598);g.stroke();}},20));
   withEnter(enter(u,0.9),()=>text('AIが、より賢いAIを作る連鎖',CX,700,36,C.sub,'center',800));
   const e1=ease((u-1.1)/0.6),e2=ease((u-1.6)/0.9),full=500,X0=330;
   withEnter(enter(u,1.0),()=>{text('1年で進む量',CX,770,36,C.sub,'center',800);
     text('ふだん',X0-24,850,40,C.sub,'right',800);rrect(X0,812,Math.max(1,full/2*e1),76,18,C.bar);text('1年分',X0+full/2*e1+16,850,40,C.text,'left',800);
     text('目安',X0-24,960,40,C.text,'right',800);rrect(X0,922,Math.max(1,full*e2),76,18,C.acc);if(e2>0.4)text('2年分',X0+full*e2-16,960,40,C.onAcc,'right',900);});
   if(u>t2){const k=back((u-t2)/0.35);g.save();g.translate(CX,1060);g.scale(k,k);text('まもなく届きうる',0,0,48,C.text);g.restore();}},
 // L4: they admit they once noticed a jump only afterwards (generated picture)
 missed(u,d,L){bg(u);brandTag();mini(u);
   mixLine([['急な成長に',C.text],['気づけなかった',C.acc]],CX,385,60);
   withEnter(enter(u,0,0.35),()=>{g.save();g.beginPath();g.roundRect(240,450,600,600,32);g.clip();const z=1.04+0.08*u/d;const i=IMG.graph;
     if(i){const w=600*z,h=w*i.height/i.width;g.drawImage(i,CX-w/2,750-h*0.47,w,h);}g.restore();},40);
   withEnter(enter(u,0.8),()=>{rrect(300,1000,480,74,20,C.card);text('過去にあったと認める',CX,1037,36,C.text,'center',800);});},
 // L5: but... (red stamp only here)
 twist(u,d,L){bg(u);brandTag();mini(u);const tb=telHas(L,'投資家');
   const st=ease(u/0.25);g.save();g.translate(CX,395);g.rotate(-0.05);g.scale(1.35-0.35*st,1.35-0.35*st);g.globalAlpha=st;rrect(-140,-52,280,104,20,C.warn);text('ただし',0,0,66,'#FFFFFF');g.restore();
   withEnter(enter(u,0.35),()=>{rrect(136,500,808,250,26,C.card);text('今のモデル',CX,560,40,C.sub,'center',800);text('「超えた」とはまだ認めていない',CX,640,48,C.text);text('（「まもなく」は次のモデルの話）',CX,705,30,C.sub,'center',700);});
   withEnter(enter(u,tb),()=>{rrect(136,790,808,250,26,C.card);text('別の見方',CX,850,40,C.sub,'center',800);text('投資家向けの宣伝？',CX,930,52,C.warn);text('（申請書は宣伝の面もある）',CX,995,30,C.sub,'center',700);});
   credit();},
 // L6: verdict: nothing changes today / watch the safety rules
 verdict(u,d,L){bg(u);brandTag();glow(CX,1250,600,C.brand,0.32);drawChar(CUR,18,510,1044,1856);const t2=telHas(L,'注目');
   const k1=back((u-0.4)/0.35),k2=back((u-t2)/0.35);
   if(u>0.4){g.save();g.translate(333,465);g.scale(k1,k1);rrect(-197,-115,394,230,32,C.card2,C.brand);
     text('今のClaude',0,-58,38,C.sub,'center',800);text('変わらない',0,22,66,C.waitText);text('機能も料金も',0,78,30,C.sub,'center',700);g.restore();}
   if(u>t2){g.save();g.translate(747,465);g.scale(k2,k2);rrect(-197,-115,394,230,32,C.buyFill);
     text('注目',0,-58,38,C.buyInk,'center',800);text('安全ルール',0,16,62,C.buyInk);text('の見直し',0,74,36,C.buyInk,'center',800);g.restore();}},
 logo(u){g.fillStyle=C.bg0;g.fillRect(0,0,W,H);const k=ease(u/0.25);g.globalAlpha=k;const i=IMG.logo;
   if(i){const w=860,h=w*i.height/i.width,sc=0.92+0.08*back(u/0.4);g.save();g.translate(CX,860);g.scale(sc,sc);g.drawImage(i,-w/2,-h/2,w,h);g.restore();}
   text('AI・ガジェット・家電のニュース',CX,1060,44,C.sub,'center',800);g.globalAlpha=1;},
};
window.render=async function(t){BOXES=[];
  CUR=await charImg(Math.round(origT(t)*P.fps));
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.fillStyle=C.bg1;g.fillRect(0,0,W,H);
  let cur=P.lines.length-1;for(let i=0;i<P.lines.length;i++){if(t<(P.lines[i+1]?P.lines[i+1].start:1e9)){cur=i;break;}}
  if(t>=P.voice_end+0.35){S.logo(t-P.voice_end-0.35);return;}
  const L=P.lines[cur],u=Math.max(0,t-L.start),d=(P.lines[cur+1]?P.lines[cur+1].start:P.voice_end)-L.start;
  g.save();if(u<0.12){const s=1.03-0.03*u/0.12;g.translate(W/2,H/2);g.scale(s,s);g.translate(-W/2,-H/2);} // small punch-in on every cut
  BASE=g.getTransform();g.save();g.translate(CX,CT.y1);g.scale(CT.s,CT.s);g.translate(-CX,-CT.y0);
  S[L.scene](u,d,L);g.restore();g.restore();
  // keep the last line on screen through short pauses
  let last=null;for(const tl of P.tel){if(tl.start<=t)last=tl;else break;}if(!last)last=P.tel[0];  // first frames: show the first line, never an empty bubble
  const BIG=['intro','verdict'];  // presenter fills the screen: normal caption over her, no bubble
  if(BIG.includes(L.scene)){if(last&&last.start>=L.start-0.01)caption(last.text,1330,(t-last.start),false);}
  else{bubble();if(last)bubbleText(last.text,t<last.start?1:(t-last.start),L.scene==='twist');}
};
