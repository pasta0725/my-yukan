}

function devBox(x,y,w,h){const m=g.getTransform();const xs=[x,x+w].map((a,i)=>m.a*a+m.c*(i?y+h:y)+m.e),ys=[y,y+h].map((b,i)=>m.b*(i?x+w:x)+m.d*b+m.f);return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];}
function noteBox(x,y,w,h){if(!MEASURE)BOXES.push(devBox(x,y,w,h));}
function checkText(s,x,y,size,align){if(MEASURE)return;const tw=g.measureText(s).width;const x0=align==='left'?x:align==='right'?x-tw:x-tw/2;const b=devBox(x0,y-size*0.5,tw,size);
  const cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;let best=null;for(const r of BOXES){if(cx>r[0]&&cx<r[2]&&cy>r[1]&&cy<r[3]&&(!best||(r[2]-r[0])*(r[3]-r[1])<(best[2]-best[0])*(best[3]-best[1])))best=r;}
  if(best&&(b[0]<best[0]-3||b[2]>best[2]+3||b[1]<best[1]-3||b[3]>best[3]+3))window.FIT_WARN.push({t:+CURT.toFixed(2),scene:P.lines[CURI]?P.lines[CURI].scene:'',text:s,over:Math.round(Math.max(best[0]-b[0],b[2]-best[2],best[1]-b[1],b[3]-best[3]))});}

function marks(s,warn){const m=new Array(s.length).fill(C.capText);
  const paint=(re,col)=>{re.lastIndex=0;let x;while((x=re.exec(s)))for(let i=x.index;i<x.index+x[0].length;i++)m[i]=col;};
  paint(/[0-9][0-9.,万円ニトコマ倍月日秒%+]*/g,C.capNum);
  // numbers inside product names (PS5, Switch 2, iPhone 17, GPT-6, M5) stay plain: only values (price, date, count) are highlighted (2026-11-14 user decision)
  const prod=/[A-Za-z][A-Za-z+]*[ -]?([0-9][0-9.]*)(?![0-9.,万円倍月日秒%年人台本件回時分])/g;let p;
  while((p=prod.exec(s))){const st=p.index+p[0].length-p[1].length;for(let i=st;i<p.index+p[0].length;i++)m[i]=C.capText;}

  if(!brk.length)return [s.slice(0,Math.ceil(s.length/2)),s.slice(Math.ceil(s.length/2))];
  const mid=s.length/2;const b=brk.sort((a,b)=>Math.abs(a-mid)-Math.abs(b-mid))[0];return [s.slice(0,b),s.slice(b)];}
function caption(s,y,k,warn){let size=66;g.font=`900 ${size}px ${FONT}`;let lines=[s];

  const lh=size*1.22, y0=y-(lines.length-1)*lh/2, sc=0.94+0.06*ease(k/0.12*1);
  g.save();g.globalAlpha*=clamp(k/0.08);g.translate(CX,y);g.scale(sc,sc);g.translate(-CX,-y);

  g.restore();}

// line breaks only at word boundaries (Intl.Segmenter), never before a particle or punctuation; 2 lines, 3 if needed to stay big
const SEG=new Intl.Segmenter('ja',{granularity:'word'});const NOSTART='、。」』）をにはがでとのもへやかよねっゃゅょぁぃぅぇぉーんてただ';
function wrapJa(s,size,maxw){g.font=`900 ${size}px ${FONT}`;const cuts=[0];let i=0;const KANJI=/[\u4e00-\u9fff々]/,HIRA=/[\u3041-\u309f]/;const segb=new Set();for(const x of SEG.segment(s)){i+=x.segment.length;segb.add(i);if(i<s.length&&!NOSTART.includes(s[i])&&!(KANJI.test(s[i-1])&&HIRA.test(s[i])))cuts.push(i);}
  // also right after particles - but not inside a word like 見なが|ら (2026-11-10 Issue #4): only when the next letter is not hiragana, or the word splitter also cuts there
  for(let j=1;j<s.length;j++)if('をにはがでとのもへやよね、。てば'.includes(s[j-1])&&!NOSTART.includes(s[j])&&(!HIRA.test(s[j])||segb.has(j)||'、。'.includes(s[j-1])))cuts.push(j);

 // L5: but... (red stamp only here)

   withEnter(enter(u,0.35),()=>{rrect(136,500,808,250,26,C.card);text('今のモデル',CX,560,40,C.sub,'center',800);text('「超えた」とはまだ認めていない',CX,640,48,C.text);text('（「まもなく」は次のモデルの話）',CX,705,30,C.sub,'center',700);});
   withEnter(enter(u,tb),()=>{rrect(136,790,808,250,26,C.card);text('別の見方',CX,850,40,C.sub,'center',800);text('投資家向けの宣伝？',CX,930,52,C.warn);text('（申請書は宣伝の面もある）',CX,995,30,C.sub,'center',700);});
   credit();},
 // L6: verdict: nothing changes today / watch the safety rules
 verdict(u,d,L){bg(u);brandTag();glow(CX,1250,600,C.brand,0.32);drawChar(CUR,18,510,1044,1856);const t2=telHas(L,'注目');
   const k1=back((u-0.4)/0.35),k2=back((u-t2)/0.35);
   if(u>0.4){g.save();g.translate(333,465);g.scale(k1,k1);rrect(-197,-115,394,230,32,C.card2,C.brand);
     text('今のClaude',0,-58,38,C.sub,'center',800);text('変わらない',0,22,66,C.waitText);text('機能も料金も',0,78,30,C.sub,'center',700);g.restore();}
   if(u>t2){g.save();g.translate(747,465);g.scale(k2,k2);rrect(-197,-115,394,230,32,C.buyFill);
     text('注目',0,-58,38,C.buyInk,'center',800);text('安全ルール',0,16,62,C.buyInk);text('の見直し',0,74,36,C.buyInk,'center',800);g.restore();}},
 logo(u){g.fillStyle=C.bg0;g.fillRect(0,0,W,H);const k=ease(u/0.25);g.globalAlpha=k;const i=IMG.logo;
   if(i){const w=860,h=w*i.height/i.width,sc=0.92+0.08*back(u/0.4);g.save();g.translate(CX,860);g.scale(sc,sc);g.drawImage(i,-w/2,-h/2,w,h);g.restore();}
   text('AI・ガジェット・家電のニュース',CX,1060,44,C.sub,'center',800);g.globalAlpha=1;},
};
window.render=async function(t){BOXES=[];
  CUR=await charImg(Math.round(origT(t)*P.fps));
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.fillStyle=C.bg1;g.fillRect(0,0,W,H);
  let cur=P.lines.length-1;for(let i=0;i<P.lines.length;i++){if(t<(P.lines[i+1]?P.lines[i+1].start:1e9)){cur=i;break;}}
  if(t>=P.voice_end+0.35){S.logo(t-P.voice_end-0.35);return;}
  const L=P.lines[cur],u=Math.max(0,t-L.start),d=(P.lines[cur+1]?P.lines[cur+1].start:P.voice_end)-L.start;
  g.save();if(u<0.12){const s=1.03-0.03*u/0.12;g.translate(W/2,H/2);g.scale(s,s);g.translate(-W/2,-H/2);} // small punch-in on every cut
  BASE=g.getTransform();g.save();g.translate(CX,CT.y1);g.scale(CT.s,CT.s);g.translate(-CX,-CT.y0);
  S[L.scene](u,d,L);g.restore();g.restore();
  // keep the last line on screen through short pauses
  let last=null;for(const tl of P.tel){if(tl.start<=t)last=tl;else break;}if(!last)last=P.tel[0];  // first frames: show the first line, never an empty bubble
  const BIG=['intro','verdict'];  // presenter fills the screen: normal caption over her, no bubble
  if(BIG.includes(L.scene)){if(last&&last.start>=L.start-0.01)caption(last.text,1330,(t-last.start),false);}
  else{bubble();if(last)bubbleText(last.text,t<last.start?1:(t-last.start),L.scene==='twist');}
};
