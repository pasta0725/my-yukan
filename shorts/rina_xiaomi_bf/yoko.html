function cover(k,x,y,w,h,z=1,alpha=1,fx=0.5,fy=0.5){const i=IMG[k];if(!i)return;const s=Math.max(w/i.width,h/i.height)*z;const iw=i.width*s,ih=i.height*s;

function marks(s){const m=new Array(s.length).fill(C.capText);const paint=(re,col)=>{re.lastIndex=0;let x;while((x=re.exec(s)))for(let i=x.index;i<x.index+x[0].length;i++)m[i]=col;};

function partTagNone(){}
// ---------- big Rina (LongCat frames, big/<scene>/NNNN.png, 1080x1920 transparent), time = since the first line of the scene ----------
const BF={};function bigImg(sc,k){const key=sc+k;if(key in BF)return Promise.resolve(BF[key]);return new Promise(r=>{const im=new Image();im.onload=()=>{BF[key]=im;r(im)};im.onerror=()=>{BF[key]=null;r(null)};im.src='big/'+sc+'/'+String(k).padStart(4,'0')+'.png';});}
let BIGF=null;const BIG_R=[980,-60,950,1689];
function bigRina(i){if(BIGF)g.drawImage(BIGF,BIG_R[0],BIG_R[1],BIG_R[2],BIG_R[3]);else Puppet.big(g,'big_hq',BIG_R[0]+150,BIG_R[1]+60,650,1170,CURT,mouthNow());}
const mouthNow=()=>{const L=P.lines[CURI];return L&&L.puppet?Puppet.mouthAt(P.voices[CURI],CURT-L.start):null;};
function mini(){const a=Puppet.assets.small_sticker;if(!a)return;const s=0.42;glow(1760,930,240,C.brand,0.18);Puppet.chibi(g,1600,670,a.size[0]*s,a.size[1]*s,CURT,mouthNow(),'small_sticker');}
window.ready=(async()=>{const ks=new Set(['banner']);Object.values(PR).forEach(p=>p.imgs.forEach(k=>ks.add(k)));
  await Promise.all([...ks].map(k=>load(k,'img/'+k+'.jpg')).concat([(Puppet.assets.big_hq=Object.assign({},Puppet.assets.big_base),Puppet.load('../../channel/rina_puppet/'))]));await document.fonts.ready;})();
const BIGS=['intro','verdict'],NOCAP_BG=['hook'];
window.render=async function(t){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.fillStyle=C.bg1;g.fillRect(0,0,W,H);
  let cur=P.lines.length-1;for(let i=0;i<P.lines.length;i++){if(t<(P.lines[i+1]?P.lines[i+1].start:1e9)){cur=i;break;}}
  CURI=cur;CURT=t;const L=P.lines[cur],u=Math.max(0,t-L.start),d=(P.lines[cur+1]?P.lines[cur+1].start:P.voice_end)-L.start;
  BIGF=null;if(BIGS.includes(L.scene)){const s0=sceneStart(cur);let k=Math.floor((t-P.lines[s0].start)*30);let im=await bigImg(L.scene,k);while(!im&&k>0){k--;im=await bigImg(L.scene,k);}BIGF=im;}
  g.save();S[L.scene](u,d,L,cur);g.restore();
  if(!BIGS.includes(L.scene))mini();
  // caption band
  let last=null;for(const tl of P.tel){if(tl.start<=t)last=tl;else break;}if(!last)last=P.tel[0];
  if(last&&t<P.voice_end+0.1){const big=BIGS.includes(L.scene);const y=big?820:1000;const cx=big?500:810,mw=big?860:1480;
    if(!big&&L.scene!=='hook'){g.fillStyle='rgba(5,8,16,0.55)';g.fillRect(0,950,1580,100);}
    caption(last.text,L.scene==='hook'?790:cx,L.scene==='hook'?900:y,L.scene==='hook'?1440:mw,t-last.start,L.scene==='hook'?96:60);}
};
