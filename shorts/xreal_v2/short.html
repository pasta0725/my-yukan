<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#141a2e}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="plan.js"></script><script src="rig.js"></script><script src="puppet.js"></script>
<script>
const W=1080,H=1920,c=document.getElementById('c'),g=c.getContext('2d'),P=window.PLAN;
const FONT='"Noto Sans CJK JP",sans-serif';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-clamp(x),3),pop=x=>{x=clamp(x);return x<1?1+0.25*Math.sin(Math.PI*x)*(1-x):1;};
const IMG={};const load=(k,s)=>new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r()};i.src=s;});
window.ready=(async()=>{await Promise.all([load('pro','img/1pro_s.png'),load('eye','img/eye.jpg')]);await Puppet.load('parts',window.RIG);await document.fonts.ready;})();
// ---------- drawing helpers ----------
function bgFill(t,gray=0){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1d2747');gr.addColorStop(1,'#0e1222');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(255,255,255,0.035)';g.lineWidth=2;for(let x=-200+(t*20%90);x<W+200;x+=90){g.beginPath();g.moveTo(x,0);g.lineTo(x-400,H);g.stroke();}}
function card(x,y,w,h,r=36,fill='#ffffff'){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill();}
function photo(img,cx,cy,size,zoom,gray=0){g.save();g.beginPath();g.roundRect(cx-size/2,cy-size/2,size,size,40);g.clip();
  g.fillStyle='#f1f2f6';g.fillRect(cx-size/2,cy-size/2,size,size);if(gray)g.filter=`grayscale(${gray})`;
  const s=size*zoom;g.drawImage(img,cx-s/2,cy-s/2,s,s);g.filter='none';g.restore();}
const lum=c=>{const n=parseInt(c.slice(1),16);return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255;};
function label(text,x,y,size,color,align='center',weight=900){g.font=`${weight} ${size}px ${FONT}`;g.textAlign=align;g.textBaseline='middle';
  // dark text (on a bright card) gets no outline; bright text gets the thick black edge
  if(lum(color)>0.45){g.lineJoin='round';g.lineWidth=size*0.22;g.strokeStyle='#000';g.strokeText(text,x,y);}
  g.fillStyle=color;g.fillText(text,x,y);}
function credit(text){g.font=`700 30px ${FONT}`;g.textAlign='right';g.textBaseline='alphabetic';g.fillStyle='rgba(255,255,255,0.75)';g.fillText(text,W-40,H-48);}
// telop: white with thick black edge, keywords coloured by meaning
const RULES=[[/ただし|別売り|必要|同じ/g,'#ff4d4d'],[/[0-9０-９][0-9０-９.,万円ニトコマ倍月日秒%]*|1\.7倍/g,'#ffd23f'],[/XREAL 1 Pro\+|XREAL|マイ夕刊/g,'#5fc8ff'],[/買い/g,'#4be37a'],[/待ち/g,'#8fb8ff']];
function telop(text,y,k){let size=text.length<=8?104:text.length<=11?90:78;g.font=`900 ${size}px ${FONT}`;
  const w0=g.measureText(text).width+size*0.3;if(w0>1000){size=Math.floor(size*1000/w0);g.font=`900 ${size}px ${FONT}`;} // always fits the screen
  const marks=new Array(text.length).fill('#ffffff');for(const [re,col] of RULES){re.lastIndex=0;let m;while((m=re.exec(text))){for(let i=m.index;i<m.index+m[0].length;i++)marks[i]=col;}}
  const wid=g.measureText(text).width;let x=W/2-wid/2;const sc=pop(k);
  g.save();g.translate(W/2,y);g.scale(sc,sc);g.translate(-W/2,-y);
  g.textAlign='left';g.textBaseline='middle';g.lineJoin='round';
  for(let i=0;i<text.length;i++){const ch=text[i],w=g.measureText(ch).width;g.lineWidth=size*0.26;g.strokeStyle='#000';g.strokeText(ch,x,y);g.fillStyle=marks[i];g.fillText(ch,x,y);x+=w;}
  g.restore();}
// ---------- scenes (local time u, duration d) ----------
const S={
 hook(u,d){bgFill(u);const nt=P.tel.find(x=>x.text==='なのに');const sw=nt?nt.start-P.lines[0].start:d*0.58; // switch exactly when she says なのに
   if(u<sw){photo(IMG.pro,540,640,980,1.0+0.12*u/sw);label('明るさ 1.7倍',540,1230,150,'#ffd23f');credit('画像：XREAL');}
   else{const v=u-sw,k=ease(v/0.3);photo(IMG.pro,540,560,700,1.1);g.save();g.translate(540,1150);g.scale(0.8+0.2*k,0.8+0.2*k);g.globalAlpha=k;
     card(-430,-150,860,300,36,'#26355f');label('税込み 8万4980円',0,-45,92,'#ffd23f');g.font=`800 52px ${FONT}`;g.fillStyle='#e6ecff';g.textAlign='center';g.fillText('前のモデルと同じ値段',0,75);g.restore();credit('画像：XREAL');}},
 intro(u,d,i){bgFill(u);label('マイ夕刊',540,330,130,'#ff9a3c');label('毎日のニュースを30秒で',540,470,60,'#fff',undefined,700);
   Puppet.draw(g,u,P.voices[i],{cx:540,bottom:1990,scale:1.05});},
 product(u,d){bgFill(u);photo(IMG.pro,540,560,800,1.05+0.06*u/d);
   const k1=ease((u-0.3)/0.4),k2=ease((u-1.3)/0.4);
   g.globalAlpha=k1;card(110,1010,860,150,30,'#26355f');label('11月10日 発売',540,1085,78,'#5fc8ff');
   g.globalAlpha=k2;card(110,1190,860,150,30,'#26355f');label('税込み 8万4980円',540,1265,78,'#ffd23f');g.globalAlpha=1;credit('画像：XREAL');},
 bright(u,d){bgFill(u);label('最大の明るさ（ニト）',540,300,66,'#fff',undefined,800);
   const full=820,e1=ease((u-0.4)/0.7),e2=ease((u-1.4)/1.0);
   label('前のモデル',130,470,52,'#c9d1ea','left',800);card(130,520,full*700/1200*e1,120,24,'#8c97b8');label(String(Math.round(700*e1)),130+full*700/1200*e1-36,580,64,'#fff','right');
   label('1 Pro+',130,730,52,'#ffd23f','left',800);card(130,780,full*e2,120,24,'#ffcc4d');label(String(Math.round(1200*e2)),130+full*e2-36,840,64,'#1a1400','right');
   if(e2>0.95){g.save();g.globalAlpha=ease((u-2.5)/0.3);label('約1.7倍',540,1010,120,'#ffd23f');g.restore();}},
 fps(u,d){bgFill(u);label('2D→3D変換のなめらかさ',540,300,62,'#fff',undefined,800);label('1秒あたりのコマ数',540,390,48,'#c9d1ea',undefined,700);
   label('30',300,640,220,'#8c97b8');label('→',540,640,140,'#ffd23f');const e=ease((u-0.6)/0.5);g.save();g.translate(780,640);g.scale(0.6+0.4*e,0.6+0.4*e);label('60',0,0,220,'#ffd23f');g.restore();
   for(let i=0;i<20;i++){const on=i<Math.floor(clamp((u-0.4)/1.8)*20);g.fillStyle=on?(i%2?'#ffcc4d':'#8c97b8'):'#2f3d69';g.beginPath();g.arc(160+i*40,900,14,0,7);g.fill();}},
 twist(u,d){bgFill(u);photo(IMG.pro,540,520,640,1.05,1);
   const st=ease(u/0.25);g.save();g.translate(540,860);g.rotate(-0.08);g.scale(1.4-0.4*st,1.4-0.4*st);g.globalAlpha=st;card(-210,-80,420,160,24,'#e23b3b');label('ただし',0,0,100,'#fff');g.restore();
   const rows=[['視野の広さ','前と同じ'],['画質','前と同じ'],['空間に固定','別売りカメラ']];
   rows.forEach(([a,b],j)=>{const k=ease((u-0.5-j*0.9)/0.35);g.globalAlpha=k;card(90,1000+j*130,900,110,24,'#26355f');label(a,140,1055+j*130,56,'#fff','left',800);label(b,940,1055+j*130,56,j==2?'#ff4d4d':'#ffd23f','right');});
   g.globalAlpha=1;credit('画像：XREAL');},
 verdict(u,d,i){bgFill(u);
   const k1=ease((u-0.2)/0.3),k2=ease((u-d*0.5)/0.3);
   g.save();g.globalAlpha=k1;card(70,170,450,330,36,'#ffcc4d');label('買い',295,265,110,'#1a1400');g.font=`800 40px ${FONT}`;g.fillStyle='#3a2e00';g.textAlign='center';g.fillText('明るい場所で',295,385);g.fillText('よく使う人',295,440);g.restore();
   g.save();g.globalAlpha=k2;card(560,170,450,330,36,'#2f4a8a');label('待ち',785,265,110,'#fff');g.font=`800 40px ${FONT}`;g.fillStyle='#e6ecff';g.textAlign='center';g.fillText('今のモデルで',785,385);g.fillText('満足な人',785,440);g.restore();
   Puppet.draw(g,u,P.voices[i],{cx:540,bottom:2050,scale:0.98});},
 logo(u){g.fillStyle='#0e1222';g.fillRect(0,0,W,H);const k=ease(u/0.25);g.globalAlpha=k;label('マイ夕刊',540,880,170,'#ff9a3c');
   g.font=`700 50px ${FONT}`;g.fillStyle='#c9d1ea';g.textAlign='center';g.fillText('毎日夕方5時半ごろ更新',540,1040);g.globalAlpha=1;},
};
window.render=function(t){
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.fillStyle='#141a2e';g.fillRect(0,0,W,H);
  let cur=P.lines.length-1;for(let i=0;i<P.lines.length;i++){if(t<(P.lines[i+1]?P.lines[i+1].start:1e9)){cur=i;break;}}
  if(t>=P.voice_end+0.35){S.logo(t-P.voice_end-0.35);return;}
  const L=P.lines[cur],u=Math.max(0,t-L.start),d=(P.lines[cur+1]?P.lines[cur+1].start:P.voice_end)-L.start;
  g.save();if(u<0.12){const s=1.04-0.04*u/0.12;g.translate(W/2,H/2);g.scale(s,s);g.translate(-W/2,-H/2);} // little punch-in on every cut
  S[L.scene](u,d,cur);g.restore();
  const ty=L.puppet?(L.scene==='verdict'?640:700):(L.scene==='hook'?1640:1640);
  for(const tl of P.tel){if(t>=tl.start&&t<tl.end){telop(tl.text,ty,(t-tl.start)/0.16);break;}}
  label('マイ夕刊',60,92,40,'#ff9a3c','left',900);
};
</script></body></html>
